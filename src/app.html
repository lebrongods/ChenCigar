  /* ========================= 生成证据包 ========================= */
  // 顺序不可变：1 校验必拍 → 2 校验查获卷烟 → 3 检查 JSZip → 4 生成 ZIP
  async function generatePackage() {
    const c = state.caseData; if (!c) return false;
    const block = r => { state.packResult = Object.assign({ ok: false }, r); render(); const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' }); return false; };
    // 1. 必拍照片
    const missing = requiredMissing(c);
    if (missing.length) {
      return block({ title: '必拍照片未拍齐（缺 ' + missing.length + ' 项），无法生成证据包', items: missing.map(m => ({ text: m.cat + ' / ' + m.item.name, itemId: m.item.id })), detail: '点击缺项可跳转到对应位置。' });
    }
    // 2. 查获卷烟
    if (c.template.requiresSeizedItems && !c.seizedItems.length) {
      return block({ title: '未登记查获卷烟，无法生成证据包', detail: '本类案件须登记查获卷烟的品规和数量（可扫码或手工输入条码）。' });
    }
    const bad = c.seizedItems.map((s, i) => ({ s, i })).filter(x => !seizedItemValid(x.s));
    if (bad.length) {
      return block({ title: '查获卷烟信息不完整，无法生成证据包', items: bad.map(x => ({ text: '第 ' + (x.i + 1) + ' 条：' + (!String(x.s.brand || '').trim() ? '品规未填' : '') + (!(Number(x.s.qty) > 0) ? (String(x.s.brand || '').trim() ? '' : '，') + '数量须大于 0' : '') })) });
    }
    // 3. JSZip
    if (typeof JSZip === 'undefined') {
      return block({ title: '打包组件（JSZip）未加载，无法生成证据包', detail: '请重新打开完整的系统文件后重试；如仍失败请联系管理员。已采集的照片不受影响。' });
    }
    if (!hasSubtle()) return block({ title: '当前浏览器不支持 SHA-256 计算，无法生成核对信息', detail: '请使用最新版 Chrome / Safari 打开。' });
    // 4. 生成 ZIP
    showBusy('正在生成证据包…');
    try {
      const ts = Date.now();
      const num = safeName(c.number);
      const zip = new JSZip();
      const used = {};
      const uniq = name => { let n = name, k = 2; while (used[n]) { n = name.replace(/\.jpg$/, '_' + (k++) + '.jpg'); } used[n] = true; return n; };
      const files = [];
      const addPhoto = async (rec, fname, meta) => {
        const url = await loadPhoto(rec);
        if (!url) throw new Error('照片数据读取失败：' + meta.label + '。请重拍该项后再打包。');
        const bytes = dataUrlToBytes(url);
        const hash = await sha256Hex(bytes);
        const name = uniq(fname);
        zip.file(name, bytes, { binary: true, date: new Date(rec.capturedAt || ts) });
        files.push(Object.assign({ name, hash, rec, size: bytes.length }, meta));
      };
      for (const cat of c.template.categories) {
        for (const it of cat.items) {
          const ev = c.evidence[it.id];
          if (hasPhoto(ev)) await addPhoto(ev, num + '_' + safeName(cat.name) + '_' + safeName(it.name) + '.jpg', { group: 'evidence', label: cat.name + ' / ' + it.name, required: it.required });
        }
      }
      for (let i = 0; i < c.seizedItems.length; i++) {
        const s = c.seizedItems[i];
        if (s.photoId) await addPhoto(s, num + '_查获卷烟_' + (i + 1) + '_' + safeName(s.brand) + '.jpg', { group: 'seized', label: '查获卷烟 ' + (i + 1) + '：' + s.brand, seizedIndex: i });
      }
      for (let i = 0; i < c.extras.length; i++) {
        const x = c.extras[i];
        await addPhoto(x, num + '_补充照片_' + (i + 1) + '_' + safeName(x.caption) + '.jpg', { group: 'extra', label: '补充照片 ' + (i + 1) + '：' + x.caption });
      }
      const logEntry = { at: ts, by: state.user.id, byName: state.user.name, action: '生成证据包', detail: '照片 ' + files.length + ' 张' };
      const manifest = buildManifest(c, files, ts, logEntry);
      zip.file('证据清单说明.txt', '﻿' + manifest.replace(/\n/g, '\r\n'), { date: new Date(ts) });
      zip.file('SHA256SUMS.txt', files.map(f => f.hash + '  ' + f.name).join('\n') + '\n', { date: new Date(ts) });
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', mimeType: 'application/zip' });
      const filename = num + '_证据包_' + stamp(ts) + '.zip';
      const file = (typeof File === 'function') ? new File([blob], filename, { type: 'application/zip' }) : blob;
      state.lastPackage = { blob, filename, file };
      const optionalMissing = caseStats(c).optTotal - caseStats(c).optDone;
      await mutateCase(c.id, cc => { cc.lastPackagedAt = ts; cc.log.push(logEntry); }, ts);
      state.packResult = { ok: true, filename, size: blob.size, photos: files.length, optionalMissing };
      hideBusy();
      downloadBlob(blob, filename);
      render();
      const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' });
      return true;
    } catch (e) {
      hideBusy();
      return block({ title: '生成证据包失败', detail: e.message || String(e) });
    } finally { hideBusy(); }
  }
  function buildManifest(c, files, ts, logEntry) {
    const L = [];
    const line = (k, v) => L.push(k + '：' + (v == null || v === '' ? '—' : v));
    L.push('涉烟案件现场证据清单说明', '==============================');
    line('系统', '涉烟案件现场证据采集系统 v' + APP_VERSION);
    line('案件编号', c.number);
    line('案件类型', c.typeName);
    line('现场地址', c.address);
    line('当事人', c.party);
    line('备注', c.note);
    line('采集人（案件创建人）', c.createdByName || nameOf(c.createdBy));
    const takers = [...new Set(files.map(f => f.rec.byName).filter(Boolean))];
    line('照片拍摄人', takers.join('、'));
    line('承办人', c.assignedTo ? nameOf(c.assignedTo) : '未分配');
    line('案件创建时间', fmtTime(c.createdAt));
    line('证据包生成时间', fmtTime(ts) + '（' + tzLabel() + '）');
    line('证据包生成人', state.user.name);
    L.push('');
    const s = caseStats(c);
    L.push('一、清单照片（必拍 ' + s.reqDone + '/' + s.reqTotal + '，选拍 ' + s.optDone + '/' + s.optTotal + '）');
    const photoLines = f => {
      L.push('    文件：' + f.name);
      L.push('    拍摄时间：' + fmtTime(f.rec.capturedAt) + '（' + tzLabel() + '）　入口：' + (f.rec.source === 'album' ? '相册导入' : '拍照') + (f.rec.byName ? '　拍摄人：' + f.rec.byName : ''));
      if (f.rec.source === 'album' && f.rec.fileTime) L.push('    原文件修改时间：' + fmtTime(f.rec.fileTime));
      L.push('    位置：' + (f.rec.geo ? fmtGeo(f.rec.geo) + '，WGS-84' : '未记录'));
      if (f.rec.quality && f.rec.quality.issues.length) L.push('    拍照质量提示：' + f.rec.quality.issues.join('、'));
      L.push('    SHA-256：' + f.hash);
    };
    let n = 0;
    files.filter(f => f.group === 'evidence').forEach(f => { L.push('[' + (++n) + '] ' + f.label + '（' + (f.required ? '必拍' : '选拍') + '）'); photoLines(f); });
    const optMissing = [];
    c.template.categories.forEach(cat => cat.items.forEach(it => { if (!it.required && !hasPhoto(c.evidence[it.id])) optMissing.push(cat.name + ' / ' + it.name); }));
    if (optMissing.length) L.push('未拍的选拍项：' + optMissing.join('；'));
    L.push('');
    L.push('二、查获卷烟（' + c.seizedItems.length + ' 条）');
    c.seizedItems.forEach((it, i) => {
      L.push('[' + (i + 1) + '] 品规：' + it.brand + '　数量：' + it.qty + ' ' + (it.unit || '条') + '　条码：' + (it.barcode || '—'));
      const f = files.find(x => x.group === 'seized' && x.seizedIndex === i);
      if (f) photoLines(f);
    });
    if (c.seizedItems.length) L.push('合计：' + seizedSummary(c.seizedItems));
    L.push('');
    const ex = files.filter(f => f.group === 'extra');
    L.push('三、补充照片（' + ex.length + ' 张）');
    ex.forEach((f, i) => { L.push('[' + (i + 1) + '] ' + f.label); photoLines(f); });
    L.push('');
    L.push('四、操作日志');
    c.log.concat([logEntry]).forEach(l => L.push(fmtTime(l.at) + '　' + l.byName + '　' + l.action + (l.detail ? '：' + l.detail : '')));
    L.push('');
    L.push('五、核对说明');
    L.push('1. 每张照片的 SHA-256 摘要见上文及 SHA256SUMS.txt。收到证据包后，可在电脑上核对照片在证据包生成后是否被改动：');
    L.push('   Linux / macOS：在解压目录执行 sha256sum -c SHA256SUMS.txt（macOS 可用 shasum -a 256 -c SHA256SUMS.txt）；');
    L.push('   Windows：certutil -hashfile 文件名 SHA256，与上文摘要比对。');
    L.push('2. 摘要只能说明"证据包生成后文件是否被改动"，不能证明照片拍摄内容的真实性，也不是防篡改措施。');
    L.push('3. 拍摄时间取自采集手机的系统时间；位置取自浏览器定位（如有），精度见括号内数值。');
    L.push('4. 照片经系统压缩（长边不超过 ' + PHOTO_MAX + ' 像素）' + (state.settings.watermark ? '，并可能叠加了案件编号、时间、采集人等水印' : '') + '。');
    return L.join('\n') + '\n';
  }
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
  }

  /* ========================= 备份导出 / 导入 ========================= */
  async function allCaseIds() {
    const ids = new Set(state.index.map(e => e.id));
    const keys = await Store.keys('case:', true);
    if (keys) keys.forEach(k => ids.add(k.slice(5)));
    return [...ids];
  }
  async function exportData() {
    const ok = await confirmDialog('导出文件包含全部案件照片和账号 PIN 摘要。\n请妥善保管，不要通过公共渠道传播或发送给无关人员。', { title: '导出备份', okText: '我知道了，导出' });
    if (!ok) return;
    showBusy('正在导出…');
    try {
      const cases = []; const photos = {};
      for (const id of await allCaseIds()) {
        const c = await getJSON(caseKey(id), true, null); if (!c) continue;
        const recs = Object.values(c.evidence || {}).concat(c.seizedItems || [], c.extras || []);
        for (const r of recs) if (r && r.photoId && !photos[r.photoId]) { const p = await getJSON(photoKey(r.photoId), true, null); if (p) photos[r.photoId] = p; }
        cases.push(c);
      }
      const ts = Date.now();
      const data = {
        format: 'tobacco-evidence-backup', formatVersion: 1, appVersion: APP_VERSION, exportedAt: ts, exportedBy: state.user.name,
        templates: await getJSON(K.templates, true, state.templates), users: await getJSON(K.users, true, state.users),
        settings: Object.assign({}, state.settings, { lastExportAt: ts }), barcodeDict: await getJSON(K.barcodes, true, {}),
        index: await getJSON(K.index, true, []), cases, photos
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      downloadBlob(blob, '证据采集系统备份_' + stamp(ts) + '.json');
      state.settings.lastExportAt = ts;
      await setJSON(K.settings, state.settings, true);
      toast('已导出：' + cases.length + ' 个案件，' + Object.keys(photos).length + ' 张照片（' + fmtSize(blob.size) + '）', 'ok', 5000);
    } finally { hideBusy(); }
  }
  async function importData(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast('无法读取该文件，请确认是本系统导出的备份文件', 'error'); return; }
    if (!data || data.format !== 'tobacco-evidence-backup' || !Array.isArray(data.users) || !Array.isArray(data.cases)) { toast('文件格式不正确，不是本系统的备份文件', 'error'); return; }
    if (!data.users.some(u => u.role === 'admin')) { toast('备份中没有管理员账号，无法还原', 'error'); return; }
    const ok = await confirmDialog('将从备份还原（导出时间 ' + fmtTime(data.exportedAt) + '）：\n' + data.cases.length + ' 个案件、' + Object.keys(data.photos || {}).length + ' 张照片、' + data.users.length + ' 个用户。\n\n当前系统中的全部数据将被覆盖，且无法撤销。', { title: '从备份还原', danger: true, okText: '覆盖并还原' });
    if (!ok) return;
    showBusy('正在还原…');
    let fail = 0;
    try {
      // 删除现有案件及照片
      for (const id of await allCaseIds()) {
        const c = await getJSON(caseKey(id), true, null);
        if (c) {
          const recs = Object.values(c.evidence || {}).concat(c.seizedItems || [], c.extras || []);
          for (const r of recs) if (r && r.photoId) await Store.del(photoKey(r.photoId), true);
        }
        await Store.del(caseKey(id), true);
      }
      const photos = data.photos || {};
      for (const pid of Object.keys(photos)) if (!(await Store.set(photoKey(pid), JSON.stringify(photos[pid]), true))) fail++;
      const idx = [];
      for (const c0 of data.cases) {
        const c = normalizeCase(c0);
        if (!(await Store.set(caseKey(c.id), JSON.stringify(c), true))) fail++;
        idx.push(indexEntry(c));
      }
      idx.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      const w = [[K.index, idx], [K.users, data.users], [K.templates, Array.isArray(data.templates) && data.templates.length ? data.templates : defaultTemplates()],
        [K.settings, Object.assign({ watermark: true }, data.settings || {})], [K.barcodes, data.barcodeDict || {}]];
      for (const [k, v] of w) if (!(await Store.set(k, JSON.stringify(v), true))) fail++;
    } finally { hideBusy(); }
    if (fail) reportSaveFail('case:');
    await loadShared();
    if (!state.user) { toast(fail ? '还原完成，但有 ' + fail + ' 项写入失败' : '还原完成：' + data.cases.length + ' 个案件，请用原账号登录', fail ? 'error' : 'ok', 5000); go('login', {}, true); return; }
    const me = state.users.find(u => u.id === state.user.id);
    toast(fail ? '还原完成，但有 ' + fail + ' 项写入失败' : '还原完成：' + data.cases.length + ' 个案件', fail ? 'error' : 'ok', 5000);
    if (!me) { toast('当前账号不在备份中，请重新登录'); logout(); return; }
    state.user = me;
    go('cases', {}, true);
  }
  async function rebuildIndex() {
    const keys = await Store.keys('case:', true);
    if (!keys) { toast('当前存储方式不支持列出数据，无法重建', 'error'); return; }
    showBusy('正在重建…');
    const idx = [];
    try {
      for (const k of keys) { const c = normalizeCase(await getJSON(k, true, null)); if (c && c.id) idx.push(indexEntry(c)); }
      idx.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } finally { hideBusy(); }
    if (await setJSON(K.index, idx, true)) { state.index = idx; toast('已重建：共 ' + idx.length + ' 个案件', 'ok'); }
  }

  /* ========================= 账号动作 ========================= */
  async function saveUsers(users) {
    const ok = await setJSON(K.users, users, true);
    if (ok) state.users = users;
    return ok;
  }
  function logout() {
    state.user = null; state.caseData = null;
    Store.del(K.session, false);
    go('login', {}, true);
  }
  async function afterLogin(user) {
    state.user = user;
    await setJSON(K.session, { userId: user.id, at: Date.now() }, false);
    state.prefs = Object.assign({ geo: true }, await getJSON(K.prefs, false, {}));
    state.lastRefresh = Date.now();
    go('cases', {}, true);
  }

  /* ========================= 事件：表单提交 ========================= */
  async function handleSubmit(name, f) {
    switch (name) {
      case 'setup': {
        const n = f.name.value.trim(), pin = f.pin.value, pin2 = f.pin2.value;
        if (!hasSubtle()) { toast('当前浏览器不支持 Web Crypto，拒绝创建账号', 'error'); return; }
        if (!n) { toast('请填写姓名', 'error'); return; }
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        if (pin !== pin2) { toast('两次输入的 PIN 不一致', 'error'); return; }
        const existing = await getJSON(K.users, true, []);
        if (existing && existing.length) { toast('系统已有账号，请登录', 'warn'); state.users = existing; go('login', {}, true); return; }
        const u = { id: uid(), name: n, role: 'admin', pinHash: await makePinHash(pin), createdAt: Date.now() };
        if (await saveUsers([u])) await afterLogin(u);
        return;
      }
      case 'login': {
        const id = f.user.value, pin = f.pin.value;
        const msg = $('#login-msg');
        state.users = await getJSON(K.users, true, state.users);
        const u = state.users.find(x => x.id === id);
        if (!u) { msg.textContent = '用户不存在'; return; }
        const fs = loginFails[id] || (loginFails[id] = { count: 0, until: 0 });
        if (fs.until > Date.now()) { msg.textContent = '连续输错次数过多，请 ' + Math.ceil((fs.until - Date.now()) / 1000) + ' 秒后再试'; return; }
        const r = await verifyPin(u, pin);
        if (r.error === 'nocrypto') { msg.textContent = '当前浏览器不支持 Web Crypto，无法验证 PIN，请使用最新版浏览器'; return; }
        if (!r.ok) {
          fs.count++;
          if (fs.count >= LOCK_MAX) { fs.count = 0; fs.until = Date.now() + LOCK_MS; msg.textContent = '连续输错 ' + LOCK_MAX + ' 次，已锁定 ' + (LOCK_MS / 1000) + ' 秒'; }
          else msg.textContent = 'PIN 错误，还可尝试 ' + (LOCK_MAX - fs.count) + ' 次';
          f.pin.value = '';
          return;
        }
        delete loginFails[id];
        if (r.upgrade) {
          const users = await getJSON(K.users, true, state.users);
          const uu = users.find(x => x.id === id);
          if (uu) { uu.pinHash = await makePinHash(pin); await saveUsers(users); }
        }
        await afterLogin(state.users.find(x => x.id === id) || u);
        return;
      }
      case 'newCase': {
        const number = f.number.value.trim();
        const typeEl = f.querySelector('input[name=typeId]:checked');
        if (!number) { toast('请填写案件编号', 'error'); return; }
        if (!typeEl) { toast('请选择案件类型', 'error'); return; }
        state.index = await getJSON(K.index, true, state.index);
        if (numberTaken(number)) { toast('案件编号已存在，请核对', 'error'); return; }
        const t = findTemplate(typeEl.value);
        const now = Date.now();
        const c = {
          id: uid(), number, typeId: t.id, typeName: t.name, template: clone(t),
          address: f.address.value.trim(), party: f.party.value.trim(), note: f.note.value.trim(),
          createdAt: now, updatedAt: now, status: 'draft', evidence: {}, seizedItems: [], extras: [], lastPackagedAt: null,
          createdBy: state.user.id, createdByName: state.user.name, assignedTo: null, log: []
        };
        addLog(c, '创建案件', t.name);
        if (!(await saveCase(c, now))) return;
        state.caseData = c; state.caseId = c.id;
        history.replaceState({ view: 'cases' }, '');
        go('case', { caseId: c.id });
        toast('案件已创建，请按清单逐项拍照', 'ok');
        return;
      }
      case 'caseInfo': {
        const number = f.number.value.trim();
        if (!number) { toast('案件编号不能为空', 'error'); return; }
        state.index = await getJSON(K.index, true, state.index);
        if (numberTaken(number, state.caseData.id)) { toast('案件编号已存在，请核对', 'error'); return; }
        const vals = { number, address: f.address.value.trim(), party: f.party.value.trim(), note: f.note.value.trim() };
        await mutateCase(state.caseData.id, cc => {
          const changed = Object.keys(vals).filter(k => (cc[k] || '') !== vals[k]);
          if (!changed.length) return false;
          Object.assign(cc, vals);
          addLog(cc, '修改案件信息', changed.map(k => ({ number: '编号', address: '地址', party: '当事人', note: '备注' }[k])).join('、'));
        });
        closeModal(); render();
        return;
      }
      case 'assign': {
        const caseId = f.dataset.id; const userId = f.user.value || null;
        const e = state.index.find(x => x.id === caseId) || indexEntry(state.caseData);
        if ((e.assignedTo || null) === userId) { closeModal(); return; }
        if (e.assignedTo) {
          closeModal();
          const ok = await confirmDialog('案件"' + e.number + '"当前由 ' + nameOf(e.assignedTo) + ' 承办。\n确定改为：' + (userId ? nameOf(userId) : '不分配') + '？', { title: '重新分配', danger: true, okText: '确定重新分配' });
          if (!ok) return;
        } else closeModal();
        await reassignCase(caseId, userId);
        if (state.view === 'cases') await refreshList(true); else render();
        return;
      }
      case 'seized': await saveSeized(); return;
      case 'prompt': { const v = f.value.value; closeModal(v); return; }
      case 'addUser': {
        const n = f.name.value.trim(), role = f.role.value, pin = f.pin.value;
        if (!hasSubtle()) { toast('当前浏览器不支持 Web Crypto，拒绝创建账号', 'error'); return; }
        if (!n) { toast('请填写姓名', 'error'); return; }
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        const users = await getJSON(K.users, true, state.users);
        if (users.some(u => u.name === n)) { toast('已有同名用户', 'error'); return; }
        users.push({ id: uid(), name: n, role: role === 'admin' ? 'admin' : 'inspector', pinHash: await makePinHash(pin), createdAt: Date.now() });
        if (await saveUsers(users)) { toast('已添加：' + n, 'ok'); render(); }
        return;
      }
      case 'resetPin': {
        const pin = f.pin.value;
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === f.dataset.id); if (!u) return;
        u.pinHash = await makePinHash(pin);
        if (await saveUsers(users)) { closeModal(); toast('已重置 ' + u.name + ' 的 PIN', 'ok'); }
        return;
      }
      case 'changePin': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === state.user.id);
        if (!u) return;
        const r = await verifyPin(u, f.old.value);
        if (!r.ok) { toast('原 PIN 不正确', 'error'); return; }
        if (!PIN_RE.test(f.pin.value)) { toast('新 PIN 须为 4–6 位数字', 'error'); return; }
        if (f.pin.value !== f.pin2.value) { toast('两次输入的新 PIN 不一致', 'error'); return; }
        u.pinHash = await makePinHash(f.pin.value);
        if (await saveUsers(users)) { state.user = u; f.reset(); toast('PIN 已修改', 'ok'); }
        return;
      }
      case 'addBarcode': {
        const code = f.code.value.trim(), brand = f.brand.value.trim();
        if (!code || !brand) return;
        const dict = await getJSON(K.barcodes, true, {}) || {};
        dict[code] = brand;
        if (await setJSON(K.barcodes, dict, true)) { state.barcodeDict = dict; toast('已保存', 'ok'); render(); }
        return;
      }
    }
  }

  /* ========================= 事件：点击 ========================= */
  async function handleAction(action, el, ev) {
    switch (action) {
      case 'mask': if (ev.target === el && ['viewer', 'confirm', 'prompt'].includes(modal.kind)) closeModal(false); return; // 表单弹窗点空白处不关闭，防止误触丢失已填内容
      case 'modal-ok': closeModal(true); return;
      case 'modal-cancel': closeModal(false); return;
      case 'modal-close': closeModal(); state.seizedEdit = null; return;
      case 'tab': go(el.dataset.view); if (el.dataset.view === 'cases') refreshList(true); return;
      case 'goto': go(el.dataset.view); return;
      case 'back': {
        const to = el.dataset.to || 'cases';
        if (state.view === 'templateEdit') state.editTemplate = null;
        go(to, {}, false);
        if (to === 'cases') refreshList(true);
        return;
      }
      case 'logout': logout(); return;
      case 'refresh': await refreshList(false); return;
      case 'new-case': go('newCase'); return;
      case 'gen-number': {
        const inp = root.querySelector('input[name=number]');
        if (inp) inp.value = '临-' + stamp(Date.now()).slice(0, 8) + '-' + stamp(Date.now()).slice(8) + '-' + state.user.name;
        return;
      }
      case 'open-case': await openCase(el.dataset.id); return;
      case 'reload-case': await openCase(state.caseData.id, true); toast('已刷新', 'ok', 1200); return;
      case 'assign-case': ev.stopPropagation(); showAssignModal(el.dataset.id); return;
      case 'edit-info': showInfoModal(); return;
      case 'delete-case': await deleteCase(); return;
      case 'capture': {
        const kind = el.dataset.kind;
        if (kind === 'seizedPhoto') syncSeizedForm();
        if (kind === 'evidence' && modal.kind === 'viewer') closeModal();
        state.pendingCapture = { kind, itemId: el.dataset.item };
        const inp = el.dataset.src === 'album' ? albumInput : cameraInput;
        inp.value = ''; inp.click();
        return;
      }
      case 'view-photo': ev.stopPropagation(); await showPhotoViewer(el.dataset.kind, el.dataset.item); return;
      case 'photo-del': closeModal(); await deletePhoto(el.dataset.kind, el.dataset.item); return;
      case 'goto-item': {
        ev.preventDefault();
        const t = document.getElementById('item-' + el.dataset.item);
        if (t) { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
        return;
      }
      case 'seized-add': state.seizedEdit = { id: null, brand: '', qty: '', unit: '条', barcode: '', thumb: '' }; renderSeizedModal(); return;
      case 'seized-edit': {
        const s = state.caseData.seizedItems.find(x => x.id === el.dataset.id); if (!s) return;
        state.seizedEdit = { id: s.id, brand: s.brand || '', qty: s.qty === '' || s.qty == null ? '' : String(s.qty), unit: s.unit || '条', barcode: s.barcode || '', thumb: s.thumb || '' };
        renderSeizedModal(); return;
      }
      case 'seized-del': {
        const s = state.caseData.seizedItems.find(x => x.id === el.dataset.id); if (!s) return;
        if (!(await confirmDialog('确定删除查获卷烟记录"' + (s.brand || '品规未填') + ' ' + (s.qty || '') + (s.unit || '') + '"吗？', { danger: true, okText: '删除' }))) return;
        let removed = null;
        const saved = await mutateCase(state.caseData.id, cc => {
          const i = cc.seizedItems.findIndex(x => x.id === s.id); if (i < 0) return false;
          removed = cc.seizedItems.splice(i, 1)[0];
          addLog(cc, '删除查获卷烟', (removed.brand || '') + ' ' + (removed.qty || '') + (removed.unit || ''));
        });
        if (saved && removed && removed.photoId) Store.del(photoKey(removed.photoId), true);
        render(); return;
      }
      case 'scan-barcode': {
        syncSeizedForm();
        if (!barcodeSupported()) {
          state.seizedEdit.barcodeMsg = '当前浏览器不支持条码自动识别，请手工输入条码';
          renderSeizedModal(); toast('当前浏览器不支持条码自动识别，请手工输入', 'warn');
          const inp = modalRoot.querySelector('input[name=barcode]'); if (inp) inp.focus();
          return;
        }
        state.pendingCapture = { kind: 'barcode' };
        cameraInput.value = ''; cameraInput.click();
        return;
      }
      case 'package': await generatePackage(); return;
      case 'download-again': if (state.lastPackage) downloadBlob(state.lastPackage.blob, state.lastPackage.filename); return;
      case 'share-package': {
        const p = state.lastPackage; if (!p) return;
        try { await navigator.share({ files: [p.file], title: p.filename }); } catch (e) { if (e && e.name !== 'AbortError') toast('分享失败，请使用"再次下载"', 'error'); }
        return;
      }
      // 用户管理
      case 'user-reset': {
        const u = state.users.find(x => x.id === el.dataset.id); if (!u) return;
        showModal('<h3>重置 ' + esc(u.name) + ' 的 PIN</h3><form data-form="resetPin" data-id="' + esc(u.id) + '"><label class="field"><span>新 PIN（4–6 位数字）</span><input type="password" name="pin" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
          '<div class="btn-row"><button type="button" class="btn" data-action="modal-close">取消</button><button type="submit" class="btn btn-primary">确定</button></div></form>', 'form');
        return;
      }
      case 'user-role': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === el.dataset.id); if (!u) return;
        const toRole = u.role === 'admin' ? 'inspector' : 'admin';
        if (toRole === 'inspector' && users.filter(x => x.role === 'admin').length <= 1) { toast('不能取消最后一个管理员', 'error'); return; }
        if (!(await confirmDialog('确定将 ' + u.name + ' 设为' + roleText(toRole) + '吗？', { okText: '确定' }))) return;
        u.role = toRole;
        if (await saveUsers(users)) {
          if (u.id === state.user.id) { state.user = u; toast('你已不再是管理员', 'warn'); go('cases', {}, true); return; }
          toast('已修改', 'ok'); render();
        }
        return;
      }
      case 'user-del': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === el.dataset.id); if (!u) return;
        if (u.id === state.user.id) { toast('不能删除当前登录的账号', 'error'); return; }
        if (u.role === 'admin' && users.filter(x => x.role === 'admin').length <= 1) { toast('不能删除最后一个管理员', 'error'); return; }
        const n = state.index.filter(e => e.assignedTo === u.id).length;
        if (!(await confirmDialog('确定删除用户"' + u.name + '"吗？' + (n ? '\n该用户名下有 ' + n + ' 个承办案件，删除后需重新分配。' : ''), { danger: true, okText: '删除用户', title: '删除用户' }))) return;
        if (await saveUsers(users.filter(x => x.id !== u.id))) { toast('已删除', 'ok'); render(); }
        return;
      }
      // 模板管理
      case 'tpl-new': state.editTemplate = { id: 't-' + uid(), name: '', requiresSeizedItems: true, categories: [{ name: '', items: [{ id: uid(), name: '', required: true }] }], isNew: true }; go('templateEdit'); return;
      case 'tpl-edit': { const t = findTemplate(el.dataset.id); if (!t) return; state.editTemplate = clone(t); go('templateEdit'); return; }
      case 'tpl-del': {
        const t = findTemplate(el.dataset.id); if (!t) return;
        if (state.templates.length <= 1) { toast('至少保留一个模板', 'error'); return; }
        if (!(await confirmDialog('确定删除模板"' + t.name + '"吗？\n已建案件不受影响（保留创建时的清单），之后不能再新建该类型案件。', { danger: true, okText: '删除模板', title: '删除模板' }))) return;
        const list = state.templates.filter(x => x.id !== t.id);
        if (await setJSON(K.templates, list, true)) { state.templates = list; toast('已删除', 'ok'); render(); }
        return;
      }
      case 'tpl-restore': {
        const have = new Set(state.templates.map(t => t.id));
        const add = defaultTemplates().filter(t => !have.has(t.id));
        if (!add.length) { toast('默认模板均已存在'); return; }
        const list = state.templates.concat(add);
        if (await setJSON(K.templates, list, true)) { state.templates = list; toast('已恢复 ' + add.length + ' 个默认模板', 'ok'); render(); }
        return;
      }
      case 'tpl-add-cat': state.editTemplate.categories.push({ name: '', items: [{ id: uid(), name: '', required: true }] }); render(); return;
      case 'tpl-del-cat': {
        const ci = +el.dataset.ci;
        if (state.editTemplate.categories.length <= 1) { toast('至少保留一个类别', 'error'); return; }
        if (!(await confirmDialog('确定删除类别"' + (state.editTemplate.categories[ci].name || '未命名') + '"及其全部拍摄项目吗？', { danger: true, okText: '删除' }))) return;
        state.editTemplate.categories.splice(ci, 1); render(); return;
      }
      case 'tpl-add-item': state.editTemplate.categories[+el.dataset.ci].items.push({ id: uid(), name: '', required: true }); render(); return;
      case 'tpl-del-item': state.editTemplate.categories[+el.dataset.ci].items.splice(+el.dataset.ii, 1); render(); return;
      case 'tpl-up': {
        const items = state.editTemplate.categories[+el.dataset.ci].items; const ii = +el.dataset.ii;
        if (ii > 0) { [items[ii - 1], items[ii]] = [items[ii], items[ii - 1]]; render(); }
        return;
      }
      case 'tpl-save': {
        const t = state.editTemplate;
        t.name = t.name.trim();
        if (!t.name) { toast('请填写案件类型名称', 'error'); return; }
        if (state.templates.some(x => x.id !== t.id && x.name === t.name)) { toast('已有同名模板', 'error'); return; }
        t.categories = t.categories.map(c => ({ name: c.name.trim(), items: c.items.map(i => ({ id: i.id, name: i.name.trim(), required: !!i.required })).filter(i => i.name) })).filter(c => c.items.length);
        if (t.categories.some(c => !c.name)) { toast('请填写类别名称', 'error'); render(); return; }
        if (!t.categories.length) { toast('至少需要一个拍摄项目', 'error'); render(); return; }
        const isNew = t.isNew; delete t.isNew;
        const list = (await getJSON(K.templates, true, state.templates)).slice();
        const i = list.findIndex(x => x.id === t.id);
        if (i >= 0) list[i] = t; else list.push(t);
        if (await setJSON(K.templates, list, true)) { state.templates = list; state.editTemplate = null; toast(isNew ? '已新建模板' : '已保存（只影响之后新建的案件）', 'ok'); go('templates', {}, true); }
        else t.isNew = isNew;
        return;
      }
      case 'barcode-del': {
        const code = el.dataset.code;
        if (!(await confirmDialog('确定从条码库删除 ' + code + '（' + state.barcodeDict[code] + '）吗？', { danger: true, okText: '删除' }))) return;
        const dict = await getJSON(K.barcodes, true, {}) || {}; delete dict[code];
        if (await setJSON(K.barcodes, dict, true)) { state.barcodeDict = dict; render(); }
        return;
      }
      case 'export': await exportData(); return;
      case 'import': importInput.value = ''; importInput.click(); return;
      case 'rebuild-index': await rebuildIndex(); return;
    }
  }

  /* ========================= 事件绑定（委托） ========================= */
  let running = 0;
  async function run(fn) {
    running++;
    try { await fn(); } catch (e) { hideBusy(); console.warn(e); toast('操作失败：' + (e && e.message ? e.message : e), 'error', 5000); } finally { running--; }
  }
  function onClick(ev) {
    const el = ev.target.closest('[data-action]');
    if (!el || !ev.currentTarget.contains(el)) return;
    if (el.tagName === 'A') ev.preventDefault();
    run(() => handleAction(el.dataset.action, el, ev));
  }
  function onSubmit(ev) {
    const f = ev.target.closest('form[data-form]'); if (!f) return;
    ev.preventDefault();
    const btn = f.querySelector('[type=submit]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    run(() => handleSubmit(f.dataset.form, f)).then(() => { if (btn && document.contains(btn)) btn.disabled = false; });
  }
  function onInput(ev) {
    const el = ev.target;
    if (el.dataset.filter) {
      state.filters[el.dataset.filter] = el.value;
      renderCaseList();
      return;
    }
    if (el.dataset.tpl && state.editTemplate) {
      const t = state.editTemplate; const ci = +el.dataset.ci, ii = +el.dataset.ii;
      if (el.dataset.tpl === 'name') t.name = el.value;
      if (el.dataset.tpl === 'seized') t.requiresSeizedItems = el.checked;
      if (el.dataset.tpl === 'cat') t.categories[ci].name = el.value;
      if (el.dataset.tpl === 'item') t.categories[ci].items[ii].name = el.value;
      if (el.dataset.tpl === 'req') t.categories[ci].items[ii].required = el.checked;
      return;
    }
    if (ev.type === 'change' && el.dataset.setting) {
      state.settings[el.dataset.setting] = el.checked;
      run(async () => { const s = Object.assign({}, await getJSON(K.settings, true, {}), { [el.dataset.setting]: el.checked }); if (await setJSON(K.settings, s, true)) { state.settings = Object.assign({ watermark: true }, s); toast('已保存设置', 'ok', 1200); } });
      return;
    }
    if (ev.type === 'change' && el.dataset.pref) {
      state.prefs[el.dataset.pref] = el.checked;
      run(async () => { if (await setJSON(K.prefs, state.prefs, false)) toast('已保存设置', 'ok', 1200); });
      return;
    }
    if (el.name === 'barcode' && modal.kind === 'seized') {
      const code = el.value.trim();
      const msg = modalRoot.querySelector('#barcode-msg');
      const chk = checkGtin(code);
      const known = state.barcodeDict[code];
      const brand = modalRoot.querySelector('input[name=brand]');
      if (known && brand && !brand.value.trim()) { brand.value = known; }
      if (msg) {
        msg.className = 'small ' + (chk === false ? 'warn-text' : 'muted');
        msg.textContent = chk === false ? '条码校验位不符，请核对是否输错' : (known ? '条码库：' + known : '');
      }
    }
  }
  [root, modalRoot].forEach(r => {
    r.addEventListener('click', onClick);
    r.addEventListener('submit', onSubmit);
    r.addEventListener('input', onInput);
    r.addEventListener('change', onInput);
  });
  function onFileChosen(ev) {
    const inp = ev.target;
    const file = inp.files && inp.files[0];
    const ctx = state.pendingCapture; state.pendingCapture = null;
    if (!file || !ctx) return;
    ctx.source = inp === albumInput ? 'album' : 'camera';
    run(() => handleCapturedFile(file, ctx)).then(() => { inp.value = ''; });
  }
  cameraInput.addEventListener('change', onFileChosen);
  albumInput.addEventListener('change', onFileChosen);
  importInput.addEventListener('change', () => { const f = importInput.files && importInput.files[0]; if (f) run(() => importData(f)); });
  $('#save-banner-close').addEventListener('click', () => { $('#save-banner').hidden = true; });

  // 列表每 30 秒自动刷新（无实时同步）
  setInterval(() => {
    if (state.user && state.view === 'cases' && !modal.kind && !document.hidden) run(() => refreshList(true));
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.user && state.view === 'cases' && !modal.kind) run(() => refreshList(true));
  });

  /* ========================= 启动 ========================= */
  async function loadShared() {
    state.users = await getJSON(K.users, true, []) || [];
    let tpls = await getJSON(K.templates, true, null);
    if (!Array.isArray(tpls) || !tpls.length) {
      tpls = defaultTemplates();
      await setJSON(K.templates, tpls, true);
    }
    state.templates = tpls;
    state.settings = Object.assign({ watermark: true }, await getJSON(K.settings, true, {}));
    state.barcodeDict = await getJSON(K.barcodes, true, {}) || {};
    state.index = await getJSON(K.index, true, []) || [];
  }
  async function init() {
    await Store.init();
    await loadShared();
    state.ready = true;
    if (!state.users.length) { go('setup', {}, true); return; }
    const sess = await getJSON(K.session, false, null);
    const u = sess && state.users.find(x => x.id === sess.userId);
    if (u) {
      state.user = u;
      state.prefs = Object.assign({ geo: true }, await getJSON(K.prefs, false, {}));
      state.lastRefresh = Date.now();
      go('cases', {}, true);
    } else go('login', {}, true);
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const est = await navigator.storage.estimate();
        const show = () => { const q = $('#quota'); if (q && est.quota) q.textContent = '约 ' + fmtSize(est.usage || 0) + ' / 可用 ' + fmtSize(est.quota); };
        new MutationObserver(show).observe(root, { childList: true }); show();
      } catch (e) { /* 忽略 */ }
    }
  }

  // 供自动化测试读取的只读接口
  window.__EVIDENCE_APP__ = {
    version: APP_VERSION,
    analyzeImageData, checkGtin, seizedItemValid, safeName,
    get backend() { return Store.backend; },
    get idle() { return running === 0; },
    get state() { return { view: state.view, user: state.user && { id: state.user.id, name: state.user.name, role: state.user.role }, caseId: state.caseId }; }
  };

  render();
  run(init);
})();
</script>
</body>
</html>
