<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c4a">
<meta name="format-detection" content="telephone=no">
<title>涉烟案件现场证据采集系统</title>
<style>
:root {
  --pri: #1d5c4a; --pri-d: #154637; --pri-l: #e6f0ec;
  --bg: #f2f4f3; --card: #fff; --text: #1c2421; --muted: #66706c; --line: #d9e0dc;
  --danger: #b83227; --danger-l: #fbeaea; --warn: #a86400; --warn-l: #fff4e0;
  --ok: #1e7a45; --ok-l: #e5f5eb; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
body.modal-open { overflow: hidden; }
img { max-width: 100%; display: block; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 6px 0; }
#view-root { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--pri); color: #fff; display: flex; align-items: center;
  gap: 8px; padding: 6px 12px; min-height: 52px; padding-top: calc(6px + env(safe-area-inset-top)); }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .who { font-size: 13px; opacity: .9; white-space: nowrap; }
.topbar .back { background: transparent; color: #fff; border: 0; font-size: 16px; min-height: 44px; min-width: 44px; padding: 0 6px; cursor: pointer; }
.content { padding: 12px; }
.card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); border: 1px solid var(--line); }
.card.alert-danger { background: var(--danger-l); border-color: #efc2be; }
.card.alert-warn { background: var(--warn-l); border-color: #f0d9a8; }
.card.alert-ok { background: var(--ok-l); border-color: #b9e0c7; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.warn-text { color: var(--warn); }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.pre { white-space: pre-wrap; }
.break { overflow-wrap: anywhere; word-break: break-all; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; min-width: 44px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text);
  font-size: 16px; line-height: 1.2; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.btn:active { filter: brightness(.94); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger-outline { color: var(--danger); border-color: #e3a8a2; }
.btn-sm { min-height: 44px; padding: 6px 10px; font-size: 14px; }
.btn-block { display: flex; width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row > .btn { flex: 1 1 120px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span, .unit-fixed > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
div.field { margin-bottom: 12px; }
input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff; color: var(--text); font-family: inherit; }
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri); outline-offset: 0; border-color: var(--pri); }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; }
.badge { display: inline-block; font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 10px; background: #eceff0; color: var(--muted); white-space: nowrap; vertical-align: middle; }
.badge.req { background: var(--danger-l); color: var(--danger); }
.badge.opt { background: #eef1f7; color: #4b5b7a; }
.badge.ok { background: var(--ok-l); color: var(--ok); }
.badge.warn { background: var(--warn-l); color: var(--warn); }
.badge.draft { background: #eceff0; color: #4d5652; }
.badge.admin { background: #e8e3f6; color: #4f3a8f; }
.progress { height: 8px; background: #e3e8e5; border-radius: 4px; overflow: hidden; margin: 8px 0; }
.progress .bar { height: 100%; background: var(--pri); }
.progress.done .bar { background: var(--ok); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: #fff; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { flex: 1; min-height: 56px; border: 0; background: transparent; font-size: 15px; color: var(--muted); cursor: pointer; }
.tabbar button.active { color: var(--pri); font-weight: 700; box-shadow: inset 0 3px 0 var(--pri); }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
.actionbar .inner { max-width: 696px; margin: 0 auto; display: flex; gap: 8px; }
.actionbar .btn { flex: 1; }
.case-card { cursor: pointer; }
.case-no { font-size: 16px; overflow-wrap: anywhere; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters .full { grid-column: 1 / -1; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; min-width: 0; }
.tile.missing { border-color: #e7b3ad; background: #fffafa; }
.tile.done { border-color: #b9e0c7; }
.tile.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px #f5b041; } }
.thumb { aspect-ratio: 4 / 3; background: #eef1ef; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.thumb .ph { color: #9aa39f; font-size: 14px; }
.tile-name { font-size: 14px; margin: 6px 0 2px; overflow-wrap: anywhere; }
.tile-actions { display: flex; gap: 6px; margin-top: 6px; }
.tile-actions .btn { flex: 1; padding: 6px 4px; }
.list-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }
.list-item .mini { width: 64px; height: 48px; flex: none; border-radius: 6px; overflow: hidden; background: #eef1ef; }
.list-item .mini img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.list-item.invalid { background: #fffafa; }
.kv { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 8px; font-size: 14px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div { overflow-wrap: anywhere; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.log-line { font-size: 13px; padding: 4px 0; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 56px; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: #fff; margin-bottom: 10px; font-size: 16px; text-align: left; cursor: pointer; color: var(--text); }
.menu-item .desc { display: block; font-size: 13px; color: var(--muted); }
.tpl-cat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.tpl-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.tpl-item .check { min-height: 44px; font-size: 13px; gap: 4px; }
.tpl-item .check input { width: 20px; height: 20px; }
.modal-mask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 560px) { .modal-mask { align-items: center; } }
.modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 560px) { .modal { border-radius: 14px; } }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare figure { margin: 0; }
.compare figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }
.viewer-img { width: 100%; border-radius: 8px; background: #111; min-height: 120px; }
#toast-root { position: fixed; left: 0; right: 0; top: calc(60px + env(safe-area-inset-top)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.toast { max-width: 520px; width: 100%; background: #26312d; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.2); pointer-events: auto; }
.toast.error { background: var(--danger); }
.toast.warn { background: #8a5a00; }
.toast.ok { background: var(--ok); }
#save-banner { position: fixed; left: 0; right: 0; top: 0; z-index: 60; background: var(--danger); color: #fff; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; display: flex; gap: 8px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#save-banner[hidden] { display: none; }
#save-banner .msg { flex: 1; font-size: 14px; }
#save-banner button { background: #fff; color: var(--danger); border: 0; border-radius: 6px; min-height: 44px; min-width: 60px; font-size: 15px; }
#busy { position: fixed; inset: 0; z-index: 80; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; }
#busy[hidden] { display: none; }
#busy .box { background: #26312d; color: #fff; padding: 14px 20px; border-radius: 10px; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.type-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.type-choice label { border: 2px solid var(--line); border-radius: 8px; padding: 10px; min-height: 56px; display: flex; align-items: center; gap: 6px; cursor: pointer; background: #fff; overflow-wrap: anywhere; }
.type-choice input { width: 20px; height: 20px; flex: none; }
.type-choice label:has(input:checked) { border-color: var(--pri); background: var(--pri-l); }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 8px; }
.section-title h2 { margin: 0; }
.match-box { margin: -6px 0 10px; }
.match { padding: 8px 10px; border-radius: 8px; background: #f1f3f2; font-size: 14px; overflow-wrap: anywhere; }
.match.ok { background: var(--ok-l); border: 1px solid #b9e0c7; }
.match.warn { background: var(--warn-l); color: var(--warn); }
.match-list { display: flex; flex-direction: column; gap: 6px; }
.match-pick { justify-content: flex-start; text-align: left; }
.stepper { display: flex; gap: 6px; }
.stepper input { text-align: center; min-width: 0; }
.stepper .btn { flex: none; width: 48px; font-size: 20px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { flex: 1 1 44px; }
.subtotal { background: #f6f7f6; border-radius: 8px; padding: 8px 10px; margin: -4px 0 12px; font-size: 14px; }
.seized-item .grow { line-height: 1.45; }
.kind-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; }
.kind-tabs .btn { padding: 6px 2px; font-size: 14px; }
.kind-tabs .btn.active, .seg .btn.active { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
.seg { display: flex; gap: 8px; }
.seg .btn { flex: 1; }
.unit-fixed { width: 84px; margin-bottom: 12px; }
.unit-fixed > div { min-height: 44px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 8px; background: #f6f7f6; }
.unit-fixed-text { min-height: 44px; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; background: #f6f7f6; }
input.readonly { background: #f3f5f4; color: var(--muted); }
.badge.kind { background: #e8eef9; color: #34507f; }
.seized-total { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
</style>
</head>
<body>
<div id="view-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="save-banner" role="alert" hidden><span class="msg"></span><button type="button" id="save-banner-close">知道了</button></div>
<div id="busy" hidden><div class="box">处理中…</div></div>
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<input type="file" id="album-input" accept="image/*" hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>
<input type="file" id="catalog-input" accept=".csv,text/csv" hidden>

<script>/*__JSZIP_INLINE__*/</script>
<script>
(function () {
  'use strict';

  /* ========================= 常量 ========================= */
  const APP_VERSION = '2.2.0';
  const PBKDF2_ITER = 100000;
  const LOCK_MAX = 5;
  const LOCK_MS = 30000;
  const PHOTO_MAX = 1280;
  const PHOTO_Q = 0.72;
  const THUMB_MAX = 320;
  const THUMB_Q = 0.6;
  const REFRESH_MS = 30000;
  const GEO_TIMEOUT = 6000;
  // 拍照质量阈值（在长边 480px 的灰度图上计算）；只提示、不拦截
  const QUALITY = { darkMean: 60, darkClip: 0.6, brightMean: 205, brightClip: 0.4, blurVar: 60 };
  const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'codabar', 'itf'];
  const UNITS = ['条', '包', '支', '件'];
  const PIN_RE = /^\d{4,6}$/;
  const K = { templates: 'templates', index: 'case-index', users: 'users', settings: 'settings', barcodes: 'barcode-dict', priceCatalog: 'price-catalog', session: 'current-session', prefs: 'prefs' };
  const caseKey = id => 'case:' + id;
  const photoKey = id => 'photo:' + id;

  /* ========================= 工具函数 ========================= */
  const $ = sel => document.querySelector(sel);
  const root = $('#view-root');
  const modalRoot = $('#modal-root');
  const cameraInput = $('#camera-input');
  const albumInput = $('#album-input');
  const importInput = $('#import-input');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function fmtDate(ts) { return ts ? fmtTime(ts).slice(0, 16) : ''; }
  function stamp(ts) {
    const d = new Date(ts);
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function tzLabel() {
    const off = -new Date().getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    return 'UTC' + sign + pad2(Math.floor(Math.abs(off) / 60)) + ':' + pad2(Math.abs(off) % 60);
  }
  function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function safeName(s) {
    return String(s || '').trim().replace(/[\\/:*?"<>|\s\u0000-\u001f]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').slice(0, 60) || '未命名';
  }
  function fmtGeo(g) { return g ? g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + '（±' + g.acc + ' 米）' : ''; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ========================= 存储层 ========================= */
  // 优先使用宿主提供的 window.storage；没有时退化为本机 IndexedDB；再不行退化为内存（刷新即丢失）
  const Store = (function () {
    let backend = 'memory';
    let db = null;
    const mem = new Map();
    const full = (key, shared) => (shared ? 'S|' : 'P|') + key;
    function hostOk() { return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
    function openDb() {
      return new Promise(resolve => {
        try {
          const req = indexedDB.open('tobacco-evidence', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
          req.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }
    function idb(mode, fn) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', mode);
        const r = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(r.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('aborted'));
      });
    }
    return {
      get backend() { return backend; },
      async init() {
        if (hostOk()) { backend = 'host'; return; }
        if (window.indexedDB) {
          db = await openDb();
          if (db) {
            backend = 'indexeddb';
            try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 忽略 */ }
            return;
          }
        }
        backend = 'memory';
      },
      async get(key, shared) {
        try {
          if (backend === 'host') {
            const r = await window.storage.get(key, shared);
            if (r == null) return null;
            if (typeof r === 'string') return r;
            return r.value == null ? null : r.value;
          }
          if (backend === 'indexeddb') {
            const v = await idb('readonly', s => s.get(full(key, shared)));
            return v == null ? null : v;
          }
          return mem.has(full(key, shared)) ? mem.get(full(key, shared)) : null;
        } catch (e) { return null; }
      },
      async set(key, value, shared) {
        try {
          if (backend === 'host') {
            const r = await window.storage.set(key, value, shared);
            return !(r === null || r === false);
          }
          if (backend === 'indexeddb') { await idb('readwrite', s => s.put(value, full(key, shared))); return true; }
          mem.set(full(key, shared), value);
          return true;
        } catch (e) { return false; }
      },
      async del(key, shared) {
        try {
          if (backend === 'host') { if (window.storage.delete) await window.storage.delete(key, shared); return true; }
          if (backend === 'indexeddb') { await idb('readwrite', s => s.delete(full(key, shared))); return true; }
          mem.delete(full(key, shared));
          return true;
        } catch (e) { return false; }
      },
      // 列出共享区中以 prefix 开头的 key（用于重建索引），不支持时返回 null
      async keys(prefix, shared) {
        try {
          if (backend === 'host') {
            if (typeof window.storage.list !== 'function') return null;
            const r = await window.storage.list(prefix, shared);
            const arr = Array.isArray(r) ? r : (r && r.keys) || [];
            return arr.map(k => typeof k === 'string' ? k : k.key).filter(k => k && k.startsWith(prefix));
          }
          const pre = full(prefix, shared);
          if (backend === 'indexeddb') {
            const all = await idb('readonly', s => s.getAllKeys());
            return all.filter(k => String(k).startsWith(pre)).map(k => String(k).slice(2));
          }
          return [...mem.keys()].filter(k => k.startsWith(pre)).map(k => k.slice(2));
        } catch (e) { return null; }
      }
    };
  })();

  function describeKey(key) {
    if (key.startsWith('photo:')) return '照片';
    if (key.startsWith('case:') || key === K.index) return '案件数据';
    if (key === K.users) return '账号数据';
    if (key === K.templates) return '案件模板';
    if (key === K.barcodes) return '条码库';
    return '系统数据';
  }
  function reportSaveFail(key) {
    const b = $('#save-banner');
    b.querySelector('.msg').textContent = '保存失败：' + describeKey(key) + '未能写入存储，刚才的修改可能没有保存。请检查手机存储空间后重试，并尽快由管理员导出备份。';
    b.hidden = false;
    toast('保存失败：' + describeKey(key) + '未写入存储', 'error', 6000);
  }
  async function getJSON(key, shared, fallback) {
    const raw = await Store.get(key, shared);
    if (raw == null) return fallback;

  function analyzeImageData(data, w, h) {

        const i = y * w + x;

  /* ========================= 视图：案件列表 ========================= */
  function visibleCases() {
    const f = state.filters; const q = f.q.trim().toLowerCase();
    return state.index.filter(e => canSeeCase(e)).filter(e => {
      if (f.type && e.typeId !== f.type) return false;
      if (f.status) {
        const st = statusOf(e).text;
        if (f.status === 'draft' && e.status !== 'draft') return false;
        if (f.status === 'complete' && !(e.status === 'complete' && !e.lastPackagedAt)) return false;
        if (f.status === 'packaged' && st !== '已打包') return false;
        if (f.status === 'dirty' && st !== '打包后有修改') return false;
      }
      if (f.assignee) {
        if (f.assignee === '__none' ? !!e.assignedTo : e.assignedTo !== f.assignee) return false;
      }
      if (q) {
        const hay = [e.number, e.typeName, e.party, e.address, e.note, nameOf(e.assignedTo), nameOf(e.createdBy)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }
  function viewCases() {
    const f = state.filters;

    const typeOpts = Object.keys(typeIds).map(id => '<option value="' + esc(id) + '"' + (f.type === id ? ' selected' : '') + '>' + esc(typeIds[id]) + '</option>').join('');
    const st = [['', '全部状态'], ['draft', '采集中'], ['complete', '已齐全待打包'], ['packaged', '已打包'], ['dirty', '打包后有修改']]
      .map(s => '<option value="' + s[0] + '"' + (f.status === s[0] ? ' selected' : '') + '>' + s[1] + '</option>').join('');

      state.users.map(u => '<option value="' + esc(u.id) + '"' + (f.assignee === u.id ? ' selected' : '') + '>' + esc(u.name) + '</option>').join('') + '</select>' : '';

      '<button type="button" class="btn" data-action="refresh">刷新</button></div>' +
      '<div class="filters" style="margin-bottom:6px"><input class="full" type="search" data-filter="q" placeholder="搜索编号 / 当事人 / 地址 / 承办人" value="' + esc(f.q) + '">' +
      '<select data-filter="type" aria-label="案件类型"><option value="">全部类型</option>' + typeOpts + '</select>' +
      '<select data-filter="status" aria-label="状态">' + st + '</select>' + (asg ? '<div class="full">' + asg + '</div>' : '') + '</div>' +
      '<div class="muted small" id="refresh-info" style="margin-bottom:8px"></div>' +
      '<div id="case-list"></div></div>' + tabbar();

  function backupReminder() {
    if (!isAdmin()) return '';
    const last = state.settings.lastExportAt;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;

    return '<div class="card alert-warn small">' + (last ? '距上次导出备份已 ' + days + ' 天。' : '尚未导出过数据备份。') +

  function caseCardHtml(e) {

  function renderCaseList() {
    const box = $('#case-list'); if (!box) return;
    const list = visibleCases();
    const total = state.index.filter(e => canSeeCase(e)).length;
    box.innerHTML = list.length ? list.map(caseCardHtml).join('') :
      '<div class="empty">' + (total ? '没有符合筛选条件的案件' : (isAdmin() ? '暂无案件。点"新建案件"开始。' : '暂无分配给你的案件。可点"新建案件"开始现场取证。')) + '</div>';
    const info = $('#refresh-info');

  async function refreshList(silent) {
    state.index = await getJSON(K.index, true, state.index);
    state.users = await getJSON(K.users, true, state.users);
    state.templates = await getJSON(K.templates, true, state.templates);
    state.settings = Object.assign({ watermark: true }, await getJSON(K.settings, true, state.settings));

  /* ========================= 视图：案件详情 ========================= */

    html += '<div class="card"><div class="row between nowrap"><h2 class="grow break">' + esc(c.number) + '</h2><span class="badge ' + st.cls + '">' + st.text + '</span></div>' +

  function itemTileHtml(c, it) {

  // 解析价格目录 CSV（支持 UTF-8 与 Excel 默认的 GBK 编码）
  function parseCsv(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
  }
  function catalogFromCsv(text) {
    const rows = parseCsv(text);
    const hi = rows.findIndex(r => r.some(x => /条码|条形码/.test(x)) && r.some(x => /零售价/.test(x)));
    if (hi < 0) throw new Error('找不到表头：需要包含"条码/条包条形码"和"建议零售价"列');
    const h = rows[hi];
    const col = re => h.findIndex(x => re.test(x));
    const ci = { code: col(/条码|条形码/), name: col(/规格名称|品规|品种规格|名称/), retail: col(/零售价/), unit: col(/^单位/), maker: col(/工业公司|生产/), cat: col(/目录|类别/) };
    if (ci.name < 0) throw new Error('找不到"规格名称"列');
    const items = []; const seen = new Set(); const bad = [];
    rows.slice(hi + 1).forEach((r, i) => {
      const code = (r[ci.code] || '').replace(/\D/g, '');
      const retail = Number(String(r[ci.retail] || '').replace(/[,，元\s]/g, ''));
      if (!/^\d{8,14}$/.test(code) || !r[ci.name] || !(retail > 0)) { if (r.join('').trim() && !/序号/.test(r.join(''))) bad.push(hi + i + 2); return; }
      if (seen.has(code)) return;
      seen.add(code);
      items.push({ code, name: r[ci.name], maker: ci.maker >= 0 ? r[ci.maker] || '' : '', cat: ci.cat >= 0 ? r[ci.cat] || '' : '', cls: '', retail, unit: ci.unit >= 0 && /支/.test(r[ci.unit] || '') ? '支' : '条' });
    });
    return { items, bad };
  }
  async function importCatalogFile(file) {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('gbk').decode(buf); } catch (e) { /* 保持 UTF-8 */ } }
    let r;
    try { r = catalogFromCsv(text.replace(/^﻿/, '')); } catch (e) { toast('导入失败：' + e.message, 'error', 6000); return; }
    if (!r.items.length) { toast('导入失败：没有读到有效的品规行', 'error'); return; }
    const version = await promptDialog('价格目录名称', '例如：2026年上半年湖南省卷烟品牌价格目录', '');
    if (version === false || version == null) return;
    const ok = await confirmDialog('读到 ' + r.items.length + ' 个品规' + (r.bad.length ? '，另有 ' + r.bad.length + ' 行格式不对已跳过（第 ' + r.bad.slice(0, 8).join('、') + (r.bad.length > 8 ? '…' : '') + ' 行）' : '') + '。\n导入后将替换当前价格目录，之后登记的卷烟按新价格带出；已登记的不受影响。', { title: '确认导入', okText: '导入' });
    if (!ok) return;
    const cat = { title: version.trim() || file.name, version: version.trim(), issued: '', items: r.items, importedAt: Date.now(), importedBy: state.user.name };
    if (await setJSON(K.priceCatalog, cat, true)) { state.customCatalog = cat; toast('已导入价格目录：' + r.items.length + ' 个品规', 'ok'); render(); }
  }

  function applyMatch(m) {

    s.priceSource = m.retail == null ? '' : s.matched;
    s.priceCat = m.local ? '' : (m.cat || '');
    s.priceExit = !!m.exit;

    state.caseData = c;

  async function saveSeized(next) {
    syncSeizedForm();
    const s = state.seizedEdit; const c = state.caseData;
    const msg = modalRoot.querySelector('#seized-msg');
    const cig = (s.kind || 'cigarette') === 'cigarette';
    if (cig && !s.brand && !s.qty && !s.barcode) { msg.textContent = '请至少填写条码、品规或数量'; return; }
    if (!cig && !s.qty) { msg.textContent = '请填写数量'; return; }
    const code = cig ? (s.matchedCode || s.barcode) : '';
    const price = s.price === '' ? '' : Number(s.price);
    const item = {
      id: s.id || uid(), kind: s.kind || 'cigarette', brand: cig ? s.brand : itemName(s.kind, s.sub, s.spec), qty: s.qty === '' ? '' : Number(s.qty), unit: s.unit || '条', barcode: code,
      price, priceUnit: s.priceUnit || '条', priceSource: price === '' ? '' : (s.priceSource || 'manual'), priceCat: s.priceSource === 'catalog' ? s.priceCat : '',
      priceExit: s.priceSource === 'catalog' && !!s.priceExit, priceVersion: s.priceSource === 'catalog' ? activeCatalog().version : ''
    };
    if (!cig) Object.assign(item, { sub: s.kind === 'ecig' ? s.sub : '', spec: s.spec });
    // 同一品规（卷烟看条码，其他物品看名称）、同一单位已登记过：询问是否合并数量
    let mergeInto = null;
    if (!s.id && (code || !cig) && Number(item.qty) > 0) {
      const dup = c.seizedItems.find(x => (cig ? x.barcode === code : (x.kind === item.kind && x.brand === item.brand && Number(x.price) === Number(item.price))) && (x.unit || '条') === item.unit && Number(x.qty) > 0);
      if (dup) {
        const snapshot = Object.assign({}, s);
        const ok = await confirmDialog('本案已登记"' + (dup.brand || code) + '" ' + dup.qty + ' ' + dup.unit + '。\n是否把本次的 ' + item.qty + ' ' + item.unit + ' 合并为 ' + (Number(dup.qty) + Number(item.qty)) + ' ' + item.unit + '？', { title: '重复品规', okText: '合并数量', cancelText: '另起一行' });
        state.seizedEdit = snapshot;
        if (ok) mergeInto = dup.id;
      }
    }
    let photo = null;
    if (s.newPhoto) {
      const photoId = await storePhoto(s.newPhoto); if (!photoId) { if (!modalRoot.querySelector('form[data-form="seized"]')) renderSeizedModal(false); return; }
      photo = photoRecord(s.newPhoto, photoId);
    }
    let oldPhotoId = null;
    const saved = await mutateCase(c.id, cc => {
      if (mergeInto) {
        const t = cc.seizedItems.find(x => x.id === mergeInto);
        if (t) {
          const before = t.qty;
          t.qty = Math.round((Number(t.qty) + Number(item.qty)) * 1000) / 1000;
          if (photo && !t.photoId) Object.assign(t, { photoId: photo.photoId, thumb: photo.thumb, capturedAt: photo.capturedAt, sha256: photo.sha256, geo: photo.geo, source: photo.source });
          addLog(cc, '合并涉案物品数量', (t.brand || code) + ' ' + before + ' + ' + item.qty + ' = ' + t.qty + t.unit);
          return;
        }
      }
      const i = cc.seizedItems.findIndex(x => x.id === item.id);
      const prev = i >= 0 ? cc.seizedItems[i] : {};
      const merged = Object.assign({}, prev, item);
      if (photo) { oldPhotoId = prev.photoId || null; Object.assign(merged, { photoId: photo.photoId, thumb: photo.thumb, capturedAt: photo.capturedAt, sha256: photo.sha256, geo: photo.geo, source: photo.source }); }
      if (i >= 0) cc.seizedItems[i] = merged; else cc.seizedItems.push(merged);
      addLog(cc, i >= 0 ? '修改涉案物品' : '登记涉案物品', '【' + kindLabelOf(item) + '】' + (item.brand || '品规未填') + ' ' + (item.qty || '?') + item.unit + (item.barcode ? '，条码 ' + item.barcode : '') + (price !== '' ? '，单价 ' + price + ' 元/' + item.priceUnit + (item.priceSource === 'manual' ? '（手工录入）' : '') : ''));
    });
    if (!saved) { if (!modalRoot.querySelector('form[data-form="seized"]')) renderSeizedModal(false); return; }
    if (oldPhotoId) Store.del(photoKey(oldPhotoId), true);
    // 价格目录里没有的条码：把品规和单价记入本地条码库，下次输入后 6 位即可带出
    if (cig && code && /^\d{6,14}$/.test(code) && item.brand && !catalogMap().has(code)) {
      const dict = await getJSON(K.barcodes, true, {}) || {};
      const cur = dict[code];
      const val = { brand: item.brand, price: price === '' ? null : price, unit: item.priceUnit };
      if (!cur || typeof cur === 'string' || cur.brand !== val.brand || cur.price !== val.price) {
        dict[code] = val; state.barcodeDict = dict;
        await setJSON(K.barcodes, dict, true);
      }
    }
    const p = priceLine(item);
    const label = (item.brand || code) + ' ' + (item.qty || '?') + item.unit + (p.amount != null ? '（' + fmtMoney(p.amount) + ' 元）' : '');
    render();
    if (next) {
      state.seizedEdit = cig ? blankSeized(item.unit === '支' ? '条' : item.unit) : blankSeized(null, item.kind, item.sub || '烟弹');
      renderSeizedModal(cig ? 'barcode' : 'qty');
      toast((mergeInto ? '已合并：' : '已保存：') + label + '，请继续录入', 'ok', 2000);
    } else {
      closeModal(); state.seizedEdit = null;
      toast(seizedItemValid(item) ? (mergeInto ? '已合并：' : '已保存：') + label : '已保存，但信息不完整，打包前需补全', seizedItemValid(item) ? 'ok' : 'warn');
    }
  }

  /* ========================= 生成证据包 ========================= */
  // 顺序不可变：1 校验必拍 → 2 校验涉案物品 → 3 检查 JSZip → 4 生成 ZIP
  async function generatePackage() {
    const c = state.caseData; if (!c) return false;
    const block = r => { state.packResult = Object.assign({ ok: false }, r); render(); const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' }); return false; };
    // 1. 必拍照片
    const missing = requiredMissing(c);
    if (missing.length) {
      return block({ title: '必拍照片未拍齐（缺 ' + missing.length + ' 项），无法生成证据包', items: missing.map(m => ({ text: m.cat + ' / ' + m.item.name, itemId: m.item.id })), detail: '点击缺项可跳转到对应位置。' });
    }
    // 2. 涉案物品
    if (c.template.requiresSeizedItems && !c.seizedItems.length) {
      return block({ title: '未登记涉案物品，无法生成证据包', detail: '本类案件须登记涉案物品的名称和数量（卷烟可扫码或输入条码）。' });
    }
    const bad = c.seizedItems.map((s, i) => ({ s, i })).filter(x => !seizedItemValid(x.s));
    if (bad.length) {
      return block({ title: '涉案物品信息不完整，无法生成证据包', items: bad.map(x => ({ text: '第 ' + (x.i + 1) + ' 条：' + (!String(x.s.brand || '').trim() ? '品规未填' : '') + (!(Number(x.s.qty) > 0) ? (String(x.s.brand || '').trim() ? '' : '，') + '数量须大于 0' : '') })) });
    }
    // 3. JSZip
    if (typeof JSZip === 'undefined') {
      return block({ title: '打包组件（JSZip）未加载，无法生成证据包', detail: '请重新打开完整的系统文件后重试；如仍失败请联系管理员。已采集的照片不受影响。' });
    }
    if (!hasSubtle()) return block({ title: '当前浏览器不支持 SHA-256 计算，无法生成核对信息', detail: '请使用最新版 Chrome / Safari 打开。' });
    // 4. 生成 ZIP
    showBusy('正在生成证据包…');
    try {
      const ts = Date.now();
      const num = safeName(c.number);
      const zip = new JSZip();
      const used = {};
      const uniq = name => { let n = name, k = 2; while (used[n]) { n = name.replace(/\.jpg$/, '_' + (k++) + '.jpg'); } used[n] = true; return n; };
      const files = [];
      const addPhoto = async (rec, fname, meta) => {
        const url = await loadPhoto(rec);
        if (!url) throw new Error('照片数据读取失败：' + meta.label + '。请重拍该项后再打包。');
        const bytes = dataUrlToBytes(url);
        const hash = await sha256Hex(bytes);
        const name = uniq(fname);
        zip.file(name, bytes, { binary: true, date: new Date(rec.capturedAt || ts) });
        files.push(Object.assign({ name, hash, rec, size: bytes.length }, meta));
      };
      for (const cat of c.template.categories) {
        for (const it of cat.items) {
          const ev = c.evidence[it.id];
          if (hasPhoto(ev)) await addPhoto(ev, num + '_' + safeName(cat.name) + '_' + safeName(it.name) + '.jpg', { group: 'evidence', label: cat.name + ' / ' + it.name, required: it.required });
        }
      }
      for (let i = 0; i < c.seizedItems.length; i++) {
        const s = c.seizedItems[i];
        if (s.photoId) await addPhoto(s, num + '_涉案物品_' + (i + 1) + '_' + safeName(s.brand) + '.jpg', { group: 'seized', label: '涉案物品 ' + (i + 1) + '：' + s.brand, seizedIndex: i });
      }
      for (let i = 0; i < c.extras.length; i++) {
        const x = c.extras[i];
        await addPhoto(x, num + '_补充照片_' + (i + 1) + '_' + safeName(x.caption) + '.jpg', { group: 'extra', label: '补充照片 ' + (i + 1) + '：' + x.caption });
      }
      // 核价表（有涉案物品时生成，按"涉案烟草专卖品核价表"模板版式）
      let sheet = null;
      if (c.seizedItems.length) {
        const x = await buildPriceSheetXlsx(c);
        sheet = { name: uniq(priceSheetName(c)), hash: await sha256Hex(x.bytes), data: x.data };
        zip.file(sheet.name, x.bytes, { binary: true, date: new Date(ts) });
      }
      const logEntry = { at: ts, by: state.user.id, byName: state.user.name, action: '生成证据包', detail: '照片 ' + files.length + ' 张' + (sheet ? '，含核价表（涉案金额 ' + fmtMoney(sheet.data.totalAmount) + ' 元）' : '') };
      const manifest = buildManifest(c, files, ts, logEntry, sheet);
      zip.file('证据清单说明.txt', '\ufeff' + manifest.replace(/\n/g, '\r\n'), { date: new Date(ts) });
      zip.file('SHA256SUMS.txt', files.map(f => f.hash + '  ' + f.name).concat(sheet ? [sheet.hash + '  ' + sheet.name] : []).join('\n') + '\n', { date: new Date(ts) });
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', mimeType: 'application/zip' });
      const filename = num + '_证据包_' + stamp(ts) + '.zip';
      const file = (typeof File === 'function') ? new File([blob], filename, { type: 'application/zip' }) : blob;
      state.lastPackage = { blob, filename, file };
      const optionalMissing = caseStats(c).optTotal - caseStats(c).optDone;
      await mutateCase(c.id, cc => { cc.lastPackagedAt = ts; cc.log.push(logEntry); }, ts);
      const amt = caseAmount(c.seizedItems);
      state.packResult = { ok: true, filename, size: blob.size, photos: files.length, optionalMissing, sheet: sheet ? sheet.name : '', amount: amt.total, unpriced: amt.count - amt.priced };
      hideBusy();
      downloadBlob(blob, filename);
      render();
      const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' });
      return true;
    } catch (e) {
      hideBusy();
      return block({ title: '生成证据包失败', detail: e.message || String(e) });
    } finally { hideBusy(); }
  }
  function buildManifest(c, files, ts, logEntry, sheet) {
    const L = [];
    const line = (k, v) => L.push(k + '：' + (v == null || v === '' ? '—' : v));
    L.push('涉烟案件现场证据清单说明', '==============================');
    line('系统', '涉烟案件现场证据采集系统 v' + APP_VERSION);
    line('案件编号', c.number);
    line('案件类型', c.typeName);
    line('现场地址', c.address);
    line('当事人', c.party);
    line('备注', c.note);
    line('采集人（案件创建人）', c.createdByName || nameOf(c.createdBy));
    const takers = [...new Set(files.map(f => f.rec.byName).filter(Boolean))];
    line('照片拍摄人', takers.join('、'));
    line('承办人', c.assignedTo ? nameOf(c.assignedTo) : '未分配');
    line('案件创建时间', fmtTime(c.createdAt));
    line('证据包生成时间', fmtTime(ts) + '（' + tzLabel() + '）');
    line('证据包生成人', state.user.name);
    L.push('');
    const s = caseStats(c);
    L.push('一、清单照片（必拍 ' + s.reqDone + '/' + s.reqTotal + '，选拍 ' + s.optDone + '/' + s.optTotal + '）');
    const photoLines = f => {
      L.push('    文件：' + f.name);
      L.push('    拍摄时间：' + fmtTime(f.rec.capturedAt) + '（' + tzLabel() + '）　入口：' + (f.rec.source === 'album' ? '相册导入' : '拍照') + (f.rec.byName ? '　拍摄人：' + f.rec.byName : ''));
      if (f.rec.source === 'album' && f.rec.fileTime) L.push('    原文件修改时间：' + fmtTime(f.rec.fileTime));
      L.push('    位置：' + (f.rec.geo ? fmtGeo(f.rec.geo) + '，WGS-84' : '未记录'));
      if (f.rec.quality && f.rec.quality.issues.length) L.push('    拍照质量提示：' + f.rec.quality.issues.join('、'));
      L.push('    SHA-256：' + f.hash);
    };
    let n = 0;
    files.filter(f => f.group === 'evidence').forEach(f => { L.push('[' + (++n) + '] ' + f.label + '（' + (f.required ? '必拍' : '选拍') + '）'); photoLines(f); });
    const optMissing = [];
    c.template.categories.forEach(cat => cat.items.forEach(it => { if (!it.required && !hasPhoto(c.evidence[it.id])) optMissing.push(cat.name + ' / ' + it.name); }));
    if (optMissing.length) L.push('未拍的选拍项：' + optMissing.join('；'));
    L.push('');
    L.push('二、涉案物品（' + c.seizedItems.length + ' 项）');
    c.seizedItems.forEach((it, i) => {
      L.push('[' + (i + 1) + '] 【' + kindOf(it.kind).label + '】' + ((it.kind || 'cigarette') === 'cigarette' ? '品规：' + it.brand + '　数量：' + it.qty + ' ' + (it.unit || '条') + '　条码：' + (it.barcode || '—') : '名称：' + it.brand + '　数量：' + it.qty + ' ' + it.unit));
      const p = priceLine(it);
      L.push('    单价：' + (p.hasPrice ? p.price + ' 元/' + p.pUnit + '（' + (it.priceSource === 'catalog' ? '价格目录' + (it.priceVersion ? ' ' + it.priceVersion : '') : it.priceSource === 'local' ? '本地条码库' : it.priceSource === 'standard' ? '系统标准价' : '手工录入') + '）' : '未核价') +
        (p.amount != null ? '　小计：' + fmtMoney(p.amount) + ' 元' : '') + (p.notes.length ? '　备注：' + p.notes.join('；') : ''));
      const f = files.find(x => x.group === 'seized' && x.seizedIndex === i);
      if (f) photoLines(f);
    });
    if (c.seizedItems.length) {
      const amt = caseAmount(c.seizedItems);
      L.push('合计：' + seizedSummary(c.seizedItems) + '；涉案金额 ' + fmtMoney(amt.total) + ' 元' + (amt.priced < amt.count ? '（另有 ' + (amt.count - amt.priced) + ' 项未核价）' : ''));
    }
    if (sheet) {
      L.push('核价表：' + sheet.name);
      L.push('    SHA-256：' + sheet.hash);
    }
    L.push('');
    const ex = files.filter(f => f.group === 'extra');
    L.push('三、补充照片（' + ex.length + ' 张）');
    ex.forEach((f, i) => { L.push('[' + (i + 1) + '] ' + f.label); photoLines(f); });
    L.push('');
    L.push('四、操作日志');
    c.log.concat([logEntry]).forEach(l => L.push(fmtTime(l.at) + '　' + l.byName + '　' + l.action + (l.detail ? '：' + l.detail : '')));
    L.push('');
    L.push('五、核对说明');
    L.push('1. 每张照片的 SHA-256 摘要见上文及 SHA256SUMS.txt。收到证据包后，可在电脑上核对照片在证据包生成后是否被改动：');
    L.push('   Linux / macOS：在解压目录执行 sha256sum -c SHA256SUMS.txt（macOS 可用 shasum -a 256 -c SHA256SUMS.txt）；');
    L.push('   Windows：certutil -hashfile 文件名 SHA256，与上文摘要比对。');
    L.push('2. 摘要只能说明"证据包生成后文件是否被改动"，不能证明照片拍摄内容的真实性，也不是防篡改措施。');
    L.push('3. 拍摄时间取自采集手机的系统时间；位置取自浏览器定位（如有），精度见括号内数值。');
    L.push('4. 照片经系统压缩（长边不超过 ' + PHOTO_MAX + ' 像素）' + (state.settings.watermark ? '，并可能叠加了案件编号、时间、采集人等水印' : '') + '。');
    return L.join('\n') + '\n';
  }
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
  }

  /* ========================= 备份导出 / 导入 ========================= */
  async function allCaseIds() {
    const ids = new Set(state.index.map(e => e.id));
    const keys = await Store.keys('case:', true);
    if (keys) keys.forEach(k => ids.add(k.slice(5)));
    return [...ids];
  }
  async function exportData() {
    const ok = await confirmDialog('导出文件包含全部案件照片和账号 PIN 摘要。\n请妥善保管，不要通过公共渠道传播或发送给无关人员。', { title: '导出备份', okText: '我知道了，导出' });
    if (!ok) return;
    showBusy('正在导出…');
    try {
      const cases = []; const photos = {};
      for (const id of await allCaseIds()) {
        const c = await getJSON(caseKey(id), true, null); if (!c) continue;
        const recs = Object.values(c.evidence || {}).concat(c.seizedItems || [], c.extras || []);
        for (const r of recs) if (r && r.photoId && !photos[r.photoId]) { const p = await getJSON(photoKey(r.photoId), true, null); if (p) photos[r.photoId] = p; }
        cases.push(c);
      }
      const ts = Date.now();
      const data = {
        format: 'tobacco-evidence-backup', formatVersion: 1, appVersion: APP_VERSION, exportedAt: ts, exportedBy: state.user.name,
        templates: await getJSON(K.templates, true, state.templates), users: await getJSON(K.users, true, state.users),
        settings: Object.assign({}, state.settings, { lastExportAt: ts }), barcodeDict: await getJSON(K.barcodes, true, {}), priceCatalog: await getJSON(K.priceCatalog, true, null),
        index: await getJSON(K.index, true, []), cases, photos
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      downloadBlob(blob, '证据采集系统备份_' + stamp(ts) + '.json');
      state.settings.lastExportAt = ts;
      await setJSON(K.settings, state.settings, true);
      toast('已导出：' + cases.length + ' 个案件，' + Object.keys(photos).length + ' 张照片（' + fmtSize(blob.size) + '）', 'ok', 5000);
    } finally { hideBusy(); }
  }
  async function importData(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast('无法读取该文件，请确认是本系统导出的备份文件', 'error'); return; }
    if (!data || data.format !== 'tobacco-evidence-backup' || !Array.isArray(data.users) || !Array.isArray(data.cases)) { toast('文件格式不正确，不是本系统的备份文件', 'error'); return; }
    if (!data.users.some(u => u.role === 'admin')) { toast('备份中没有管理员账号，无法还原', 'error'); return; }
    const ok = await confirmDialog('将从备份还原（导出时间 ' + fmtTime(data.exportedAt) + '）：\n' + data.cases.length + ' 个案件、' + Object.keys(data.photos || {}).length + ' 张照片、' + data.users.length + ' 个用户。\n\n当前系统中的全部数据将被覆盖，且无法撤销。', { title: '从备份还原', danger: true, okText: '覆盖并还原' });
    if (!ok) return;
    showBusy('正在还原…');
    let fail = 0;
    try {
      // 删除现有案件及照片
      for (const id of await allCaseIds()) {
        const c = await getJSON(caseKey(id), true, null);
        if (c) {
          const recs = Object.values(c.evidence || {}).concat(c.seizedItems || [], c.extras || []);
          for (const r of recs) if (r && r.photoId) await Store.del(photoKey(r.photoId), true);
        }
        await Store.del(caseKey(id), true);
      }
      const photos = data.photos || {};
      for (const pid of Object.keys(photos)) if (!(await Store.set(photoKey(pid), JSON.stringify(photos[pid]), true))) fail++;
      const idx = [];
      for (const c0 of data.cases) {
        const c = normalizeCase(c0);
        if (!(await Store.set(caseKey(c.id), JSON.stringify(c), true))) fail++;
        idx.push(indexEntry(c));
      }
      idx.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      const w = [[K.index, idx], [K.users, data.users], [K.templates, Array.isArray(data.templates) && data.templates.length ? data.templates : defaultTemplates()],
        [K.settings, Object.assign({ watermark: true }, data.settings || {})], [K.barcodes, data.barcodeDict || {}]];
      if (data.priceCatalog) w.push([K.priceCatalog, data.priceCatalog]); else await Store.del(K.priceCatalog, true);
      for (const [k, v] of w) if (!(await Store.set(k, JSON.stringify(v), true))) fail++;
    } finally { hideBusy(); }
    if (fail) reportSaveFail('case:');
    await loadShared();
    if (!state.user) { toast(fail ? '还原完成，但有 ' + fail + ' 项写入失败' : '还原完成：' + data.cases.length + ' 个案件，请用原账号登录', fail ? 'error' : 'ok', 5000); go('login', {}, true); return; }
    const me = state.users.find(u => u.id === state.user.id);
    toast(fail ? '还原完成，但有 ' + fail + ' 项写入失败' : '还原完成：' + data.cases.length + ' 个案件', fail ? 'error' : 'ok', 5000);
    if (!me) { toast('当前账号不在备份中，请重新登录'); logout(); return; }
    state.user = me;
    go('cases', {}, true);
  }
  async function rebuildIndex() {
    const keys = await Store.keys('case:', true);
    if (!keys) { toast('当前存储方式不支持列出数据，无法重建', 'error'); return; }
    showBusy('正在重建…');
    const idx = [];
    try {
      for (const k of keys) { const c = normalizeCase(await getJSON(k, true, null)); if (c && c.id) idx.push(indexEntry(c)); }
      idx.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } finally { hideBusy(); }
    if (await setJSON(K.index, idx, true)) { state.index = idx; toast('已重建：共 ' + idx.length + ' 个案件', 'ok'); }
  }

  /* ========================= 事件：表单提交 ========================= */
  async function handleSubmit(name, f) {
    switch (name) {
      case 'setup': {
        const n = f.name.value.trim(), pin = f.pin.value, pin2 = f.pin2.value;
        if (!hasSubtle()) { toast('当前浏览器不支持 Web Crypto，拒绝创建账号', 'error'); return; }
        if (!n) { toast('请填写姓名', 'error'); return; }
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        if (pin !== pin2) { toast('两次输入的 PIN 不一致', 'error'); return; }
        const existing = await getJSON(K.users, true, []);
        if (existing && existing.length) { toast('系统已有账号，请登录', 'warn'); state.users = existing; go('login', {}, true); return; }
        const u = { id: uid(), name: n, role: 'admin', pinHash: await makePinHash(pin), createdAt: Date.now() };
        if (await saveUsers([u])) await afterLogin(u);
        return;
      }
      case 'login': {
        const id = f.user.value, pin = f.pin.value;
        const msg = $('#login-msg');
        state.users = await getJSON(K.users, true, state.users);
        const u = state.users.find(x => x.id === id);
        if (!u) { msg.textContent = '用户不存在'; return; }
        const fs = loginFails[id] || (loginFails[id] = { count: 0, until: 0 });
        if (fs.until > Date.now()) { msg.textContent = '连续输错次数过多，请 ' + Math.ceil((fs.until - Date.now()) / 1000) + ' 秒后再试'; return; }
        const r = await verifyPin(u, pin);
        if (r.error === 'nocrypto') { msg.textContent = '当前浏览器不支持 Web Crypto，无法验证 PIN，请使用最新版浏览器'; return; }
        if (!r.ok) {
          fs.count++;
          if (fs.count >= LOCK_MAX) { fs.count = 0; fs.until = Date.now() + LOCK_MS; msg.textContent = '连续输错 ' + LOCK_MAX + ' 次，已锁定 ' + (LOCK_MS / 1000) + ' 秒'; }
          else msg.textContent = 'PIN 错误，还可尝试 ' + (LOCK_MAX - fs.count) + ' 次';
          f.pin.value = '';
          return;
        }
        delete loginFails[id];
        if (r.upgrade) {
          const users = await getJSON(K.users, true, state.users);
          const uu = users.find(x => x.id === id);
          if (uu) { uu.pinHash = await makePinHash(pin); await saveUsers(users); }
        }
        await afterLogin(state.users.find(x => x.id === id) || u);
        return;
      }
      case 'newCase': {
        const number = f.number.value.trim();
        const typeEl = f.querySelector('input[name=typeId]:checked');
        if (!number) { toast('请填写案件编号', 'error'); return; }
        if (!typeEl) { toast('请选择案件类型', 'error'); return; }
        state.index = await getJSON(K.index, true, state.index);
        if (numberTaken(number)) { toast('案件编号已存在，请核对', 'error'); return; }
        const t = findTemplate(typeEl.value);
        const now = Date.now();
        const c = {
          id: uid(), number, typeId: t.id, typeName: t.name, template: clone(t),
          address: f.address.value.trim(), party: f.party.value.trim(), note: f.note.value.trim(),
          createdAt: now, updatedAt: now, status: 'draft', evidence: {}, seizedItems: [], extras: [], lastPackagedAt: null,
          createdBy: state.user.id, createdByName: state.user.name, assignedTo: null, log: []
        };
        addLog(c, '创建案件', t.name);
        if (!(await saveCase(c, now))) return;
        state.caseData = c; state.caseId = c.id;
        history.replaceState({ view: 'cases' }, '');
        go('case', { caseId: c.id });
        toast('案件已创建，请按清单逐项拍照', 'ok');
        return;
      }
      case 'caseInfo': {
        const number = f.number.value.trim();
        if (!number) { toast('案件编号不能为空', 'error'); return; }
        state.index = await getJSON(K.index, true, state.index);
        if (numberTaken(number, state.caseData.id)) { toast('案件编号已存在，请核对', 'error'); return; }
        const vals = { number, address: f.address.value.trim(), party: f.party.value.trim(), note: f.note.value.trim(), filingDate: f.filingDate.value, cause: f.cause.value.trim() };
        await mutateCase(state.caseData.id, cc => {
          const changed = Object.keys(vals).filter(k => (cc[k] || '') !== vals[k]);
          if (!changed.length) return false;
          Object.assign(cc, vals);
          addLog(cc, '修改案件信息', changed.map(k => ({ number: '编号', address: '地址', party: '当事人', note: '备注', filingDate: '立案日期', cause: '案由' }[k])).join('、'));
        });
        closeModal(); render();
        return;
      }
      case 'assign': {
        const caseId = f.dataset.id; const userId = f.user.value || null;
        const e = state.index.find(x => x.id === caseId) || indexEntry(state.caseData);
        if ((e.assignedTo || null) === userId) { closeModal(); return; }
        if (e.assignedTo) {
          closeModal();
          const ok = await confirmDialog('案件"' + e.number + '"当前由 ' + nameOf(e.assignedTo) + ' 承办。\n确定改为：' + (userId ? nameOf(userId) : '不分配') + '？', { title: '重新分配', danger: true, okText: '确定重新分配' });
          if (!ok) return;
        } else closeModal();
        await reassignCase(caseId, userId);
        if (state.view === 'cases') await refreshList(true); else render();
        return;
      }
      case 'seized': await saveSeized(false); return;
      case 'prompt': { const v = f.value.value; closeModal(v); return; }
      case 'addUser': {
        const n = f.name.value.trim(), role = f.role.value, pin = f.pin.value;
        if (!hasSubtle()) { toast('当前浏览器不支持 Web Crypto，拒绝创建账号', 'error'); return; }
        if (!n) { toast('请填写姓名', 'error'); return; }
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        const users = await getJSON(K.users, true, state.users);
        if (users.some(u => u.name === n)) { toast('已有同名用户', 'error'); return; }
        users.push({ id: uid(), name: n, role: role === 'admin' ? 'admin' : 'inspector', pinHash: await makePinHash(pin), createdAt: Date.now() });
        if (await saveUsers(users)) { toast('已添加：' + n, 'ok'); render(); }
        return;
      }
      case 'resetPin': {
        const pin = f.pin.value;
        if (!PIN_RE.test(pin)) { toast('PIN 须为 4–6 位数字', 'error'); return; }
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === f.dataset.id); if (!u) return;
        u.pinHash = await makePinHash(pin);
        if (await saveUsers(users)) { closeModal(); toast('已重置 ' + u.name + ' 的 PIN', 'ok'); }
        return;
      }
      case 'changePin': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === state.user.id);
        if (!u) return;
        const r = await verifyPin(u, f.old.value);
        if (!r.ok) { toast('原 PIN 不正确', 'error'); return; }
        if (!PIN_RE.test(f.pin.value)) { toast('新 PIN 须为 4–6 位数字', 'error'); return; }
        if (f.pin.value !== f.pin2.value) { toast('两次输入的新 PIN 不一致', 'error'); return; }
        u.pinHash = await makePinHash(f.pin.value);
        if (await saveUsers(users)) { state.user = u; f.reset(); toast('PIN 已修改', 'ok'); }
        return;
      }
      case 'addBarcode': {
        const code = f.code.value.trim(), brand = f.brand.value.trim();
        if (!code || !brand) return;
        const dict = await getJSON(K.barcodes, true, {}) || {};
        dict[code] = { brand, price: f.price.value === '' ? null : Number(f.price.value), unit: f.unit.value };
        if (await setJSON(K.barcodes, dict, true)) { state.barcodeDict = dict; toast('已保存', 'ok'); render(); }
        return;
      }
      case 'stdPrices': {
        const num = n => { const x = f.elements[n].value.trim(); return x === '' ? '' : Number(x); };
        const vals = { leafPrice: num('leafPrice'), tubePrice: num('tubePrice'), ecigPodPrice: num('ecigPodPrice'), ecigDevicePrice: num('ecigDevicePrice'), stdBasis: f.stdBasis.value.trim() };
        if (!(vals.leafPrice > 0) || !(vals.tubePrice > 0)) { toast('烟叶、空管烟单价须大于 0', 'error'); return; }
        if ([vals.ecigPodPrice, vals.ecigDevicePrice].some(x => x !== '' && !(x > 0))) { toast('电子烟单价须大于 0，或留空', 'error'); return; }
        const cur = await getJSON(K.settings, true, {}) || {};
        const next = Object.assign({}, cur, vals);
        if (await setJSON(K.settings, next, true)) { state.settings = Object.assign({ watermark: true }, next); toast('已保存标准价', 'ok'); render(); }
        return;
      }
      case 'priceSettings': {
        const cur = await getJSON(K.settings, true, {}) || {};
        const next = Object.assign({}, cur, { priceOrg: f.org.value.trim(), priceBasis: f.basis.value.trim() });
        if (await setJSON(K.settings, next, true)) { state.settings = Object.assign({ watermark: true }, next); toast('已保存核价表设置', 'ok'); }
        return;
      }
    }
  }

  /* ========================= 事件：点击 ========================= */
  async function handleAction(action, el, ev) {
    switch (action) {
      case 'mask': if (ev.target === el && ['viewer', 'confirm', 'prompt'].includes(modal.kind)) closeModal(false); return; // 表单弹窗点空白处不关闭，防止误触丢失已填内容
      case 'modal-ok': closeModal(true); return;
      case 'modal-cancel': closeModal(false); return;
      case 'modal-close': closeModal(); state.seizedEdit = null; return;
      case 'tab': go(el.dataset.view); if (el.dataset.view === 'cases') refreshList(true); return;
      case 'goto': go(el.dataset.view); return;
      case 'back': {
        const to = el.dataset.to || 'cases';
        if (state.view === 'templateEdit') state.editTemplate = null;
        go(to, {}, false);
        if (to === 'cases') refreshList(true);
        return;
      }
      case 'logout': logout(); return;
      case 'refresh': await refreshList(false); return;
      case 'new-case': go('newCase'); return;
      case 'gen-number': {
        const inp = root.querySelector('input[name=number]');
        if (inp) inp.value = '临-' + stamp(Date.now()).slice(0, 8) + '-' + stamp(Date.now()).slice(8) + '-' + state.user.name;
        return;
      }
      case 'open-case': await openCase(el.dataset.id); return;
      case 'reload-case': await openCase(state.caseData.id, true); toast('已刷新', 'ok', 1200); return;
      case 'assign-case': ev.stopPropagation(); showAssignModal(el.dataset.id); return;
      case 'edit-info': showInfoModal(); return;
      case 'delete-case': await deleteCase(); return;
      case 'capture': {
        const kind = el.dataset.kind;
        if (kind === 'seizedPhoto') syncSeizedForm();
        if (kind === 'evidence' && modal.kind === 'viewer') closeModal();
        state.pendingCapture = { kind, itemId: el.dataset.item };
        const inp = el.dataset.src === 'album' ? albumInput : cameraInput;
        inp.value = ''; inp.click();
        return;
      }
      case 'view-photo': ev.stopPropagation(); await showPhotoViewer(el.dataset.kind, el.dataset.item); return;
      case 'photo-del': closeModal(); await deletePhoto(el.dataset.kind, el.dataset.item); return;
      case 'goto-item': {
        ev.preventDefault();
        const t = document.getElementById('item-' + el.dataset.item);
        if (t) { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
        return;
      }
      case 'seized-add': state.seizedEdit = blankSeized('条'); renderSeizedModal('barcode'); return;
      case 'seized-save-next': await saveSeized(true); return;
      case 'seized-kind': {
        syncSeizedForm();
        const s = state.seizedEdit; const k = el.dataset.k;
        if (s.kind === k) return;
        const keep = { id: s.id, qty: s.qty, thumb: s.thumb, newPhoto: s.newPhoto };
        state.seizedEdit = Object.assign(blankSeized(k === 'cigarette' ? '条' : null, k, s.sub), keep);
        renderSeizedModal(k === 'cigarette' ? 'barcode' : false);
        return;
      }
      case 'seized-sub': {
        syncSeizedForm();
        const s = state.seizedEdit; s.sub = el.dataset.v;
        applyKindDefaults(s);
        renderSeizedModal(false);
        return;
      }
      case 'pick-cand': {
        syncSeizedForm();
        const m = state.seizedEdit.cands && state.seizedEdit.cands.find(x => x.code === el.dataset.code);
        if (m) { applyMatch(m); renderSeizedModal('qty'); }
        return;
      }
      case 'qty-step': case 'qty-set': {
        syncSeizedForm();
        const s = state.seizedEdit; const cur = Number(s.qty) || 0;
        s.qty = String(action === 'qty-set' ? Number(el.dataset.v) : Math.max(0, Math.round((cur + Number(el.dataset.d)) * 1000) / 1000));
        const f = modalRoot.querySelector('form[data-form="seized"]'); if (f) f.qty.value = s.qty;
        modalRoot.querySelector('#subtotal').innerHTML = subtotalText(s);
        return;
      }
      case 'price-sheet': await downloadPriceSheet(); return;
      case 'seized-edit': {
        const s = state.caseData.seizedItems.find(x => x.id === el.dataset.id); if (!s) return;
        state.seizedEdit = seizedFromItem(s);
        renderSeizedModal(Number(s.qty) > 0 ? false : 'qty'); return;
      }
      case 'seized-del': {
        const s = state.caseData.seizedItems.find(x => x.id === el.dataset.id); if (!s) return;
        if (modal.kind === 'seized') { closeModal(); state.seizedEdit = null; }
        if (!(await confirmDialog('确定删除涉案物品记录"' + (s.brand || '品规未填') + ' ' + (s.qty || '') + (s.unit || '') + '"吗？', { danger: true, okText: '删除' }))) return;
        let removed = null;
        const saved = await mutateCase(state.caseData.id, cc => {
          const i = cc.seizedItems.findIndex(x => x.id === s.id); if (i < 0) return false;
          removed = cc.seizedItems.splice(i, 1)[0];
          addLog(cc, '删除涉案物品', (removed.brand || '') + ' ' + (removed.qty || '') + (removed.unit || ''));
        });
        if (saved && removed && removed.photoId) Store.del(photoKey(removed.photoId), true);
        render(); return;
      }
      case 'scan-barcode': {
        syncSeizedForm();
        if (!barcodeSupported()) {
          if (!state.seizedEdit.matchedCode) state.seizedEdit.barcodeMsg = '当前浏览器不支持条码自动识别，请直接输入条码后 6 位';
          renderSeizedModal('barcode'); toast('当前浏览器不支持条码自动识别，请直接输入条码后 6 位', 'warn');
          return;
        }
        state.pendingCapture = { kind: 'barcode' };
        cameraInput.value = ''; cameraInput.click();
        return;
      }
      case 'package': await generatePackage(); return;
      case 'download-again': if (state.lastPackage) downloadBlob(state.lastPackage.blob, state.lastPackage.filename); return;
      case 'share-package': {
        const p = state.lastPackage; if (!p) return;
        try { await navigator.share({ files: [p.file], title: p.filename }); } catch (e) { if (e && e.name !== 'AbortError') toast('分享失败，请使用"再次下载"', 'error'); }
        return;
      }
      // 用户管理
      case 'user-reset': {
        const u = state.users.find(x => x.id === el.dataset.id); if (!u) return;
        showModal('<h3>重置 ' + esc(u.name) + ' 的 PIN</h3><form data-form="resetPin" data-id="' + esc(u.id) + '"><label class="field"><span>新 PIN（4–6 位数字）</span><input type="password" name="pin" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
          '<div class="btn-row"><button type="button" class="btn" data-action="modal-close">取消</button><button type="submit" class="btn btn-primary">确定</button></div></form>', 'form');
        return;
      }
      case 'user-role': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === el.dataset.id); if (!u) return;
        const toRole = u.role === 'admin' ? 'inspector' : 'admin';
        if (toRole === 'inspector' && users.filter(x => x.role === 'admin').length <= 1) { toast('不能取消最后一个管理员', 'error'); return; }
        if (!(await confirmDialog('确定将 ' + u.name + ' 设为' + roleText(toRole) + '吗？', { okText: '确定' }))) return;
        u.role = toRole;
        if (await saveUsers(users)) {
          if (u.id === state.user.id) { state.user = u; toast('你已不再是管理员', 'warn'); go('cases', {}, true); return; }
          toast('已修改', 'ok'); render();
        }
        return;
      }
      case 'user-del': {
        const users = await getJSON(K.users, true, state.users);
        const u = users.find(x => x.id === el.dataset.id); if (!u) return;
        if (u.id === state.user.id) { toast('不能删除当前登录的账号', 'error'); return; }
        if (u.role === 'admin' && users.filter(x => x.role === 'admin').length <= 1) { toast('不能删除最后一个管理员', 'error'); return; }
        const n = state.index.filter(e => e.assignedTo === u.id).length;
        if (!(await confirmDialog('确定删除用户"' + u.name + '"吗？' + (n ? '\n该用户名下有 ' + n + ' 个承办案件，删除后需重新分配。' : ''), { danger: true, okText: '删除用户', title: '删除用户' }))) return;
        if (await saveUsers(users.filter(x => x.id !== u.id))) { toast('已删除', 'ok'); render(); }
        return;
      }
      // 模板管理
      case 'tpl-new': state.editTemplate = { id: 't-' + uid(), name: '', requiresSeizedItems: true, categories: [{ name: '', items: [{ id: uid(), name: '', required: true }] }], isNew: true }; go('templateEdit'); return;
      case 'tpl-edit': { const t = findTemplate(el.dataset.id); if (!t) return; state.editTemplate = clone(t); go('templateEdit'); return; }
      case 'tpl-del': {
        const t = findTemplate(el.dataset.id); if (!t) return;
        if (state.templates.length <= 1) { toast('至少保留一个模板', 'error'); return; }
        if (!(await confirmDialog('确定删除模板"' + t.name + '"吗？\n已建案件不受影响（保留创建时的清单），之后不能再新建该类型案件。', { danger: true, okText: '删除模板', title: '删除模板' }))) return;
        const list = state.templates.filter(x => x.id !== t.id);
        if (await setJSON(K.templates, list, true)) { state.templates = list; toast('已删除', 'ok'); render(); }
        return;
      }
      case 'tpl-restore': {
        const have = new Set(state.templates.map(t => t.id));
        const add = defaultTemplates().filter(t => !have.has(t.id));
        if (!add.length) { toast('默认模板均已存在'); return; }
        const list = state.templates.concat(add);
        if (await setJSON(K.templates, list, true)) { state.templates = list; toast('已恢复 ' + add.length + ' 个默认模板', 'ok'); render(); }
        return;
      }
      case 'tpl-add-cat': state.editTemplate.categories.push({ name: '', items: [{ id: uid(), name: '', required: true }] }); render(); return;
      case 'tpl-del-cat': {
        const ci = +el.dataset.ci;
        if (state.editTemplate.categories.length <= 1) { toast('至少保留一个类别', 'error'); return; }
        if (!(await confirmDialog('确定删除类别"' + (state.editTemplate.categories[ci].name || '未命名') + '"及其全部拍摄项目吗？', { danger: true, okText: '删除' }))) return;
        state.editTemplate.categories.splice(ci, 1); render(); return;
      }
      case 'tpl-add-item': state.editTemplate.categories[+el.dataset.ci].items.push({ id: uid(), name: '', required: true }); render(); return;
      case 'tpl-del-item': state.editTemplate.categories[+el.dataset.ci].items.splice(+el.dataset.ii, 1); render(); return;
      case 'tpl-up': {
        const items = state.editTemplate.categories[+el.dataset.ci].items; const ii = +el.dataset.ii;
        if (ii > 0) { [items[ii - 1], items[ii]] = [items[ii], items[ii - 1]]; render(); }
        return;
      }
      case 'tpl-save': {
        const t = state.editTemplate;
        t.name = t.name.trim();
        if (!t.name) { toast('请填写案件类型名称', 'error'); return; }
        if (state.templates.some(x => x.id !== t.id && x.name === t.name)) { toast('已有同名模板', 'error'); return; }
        t.categories = t.categories.map(c => ({ name: c.name.trim(), items: c.items.map(i => ({ id: i.id, name: i.name.trim(), required: !!i.required })).filter(i => i.name) })).filter(c => c.items.length);
        if (t.categories.some(c => !c.name)) { toast('请填写类别名称', 'error'); render(); return; }
        if (!t.categories.length) { toast('至少需要一个拍摄项目', 'error'); render(); return; }
        const isNew = t.isNew; delete t.isNew;
        const list = (await getJSON(K.templates, true, state.templates)).slice();
        const i = list.findIndex(x => x.id === t.id);
        if (i >= 0) list[i] = t; else list.push(t);
        if (await setJSON(K.templates, list, true)) { state.templates = list; state.editTemplate = null; toast(isNew ? '已新建模板' : '已保存（只影响之后新建的案件）', 'ok'); go('templates', {}, true); }
        else t.isNew = isNew;
        return;
      }
      case 'barcode-del': {
        const code = el.dataset.code;
        if (!(await confirmDialog('确定从条码库删除 ' + code + '（' + (dictEntry(code) || {}).name + '）吗？', { danger: true, okText: '删除' }))) return;
        const dict = await getJSON(K.barcodes, true, {}) || {}; delete dict[code];
        if (await setJSON(K.barcodes, dict, true)) { state.barcodeDict = dict; render(); }
        return;
      }
      case 'catalog-import': $('#catalog-input').value = ''; $('#catalog-input').click(); return;
      case 'catalog-reset': {
        if (!(await confirmDialog('确定删除导入的价格目录，恢复系统内置的"' + (BUILTIN_CATALOG ? BUILTIN_CATALOG.title : '') + '"吗？', { danger: true, okText: '恢复内置目录' }))) return;
        if (await Store.del(K.priceCatalog, true)) { state.customCatalog = null; toast('已恢复内置目录', 'ok'); render(); }
        return;
      }
      case 'export': await exportData(); return;
      case 'import': importInput.value = ''; importInput.click(); return;
      case 'rebuild-index': await rebuildIndex(); return;
    }
  }

  /* ========================= 事件绑定（委托） ========================= */
  let running = 0;
  async function run(fn) {
    running++;
    try { await fn(); } catch (e) { hideBusy(); console.warn(e); toast('操作失败：' + (e && e.message ? e.message : e), 'error', 5000); } finally { running--; }
  }
  function onClick(ev) {
    const el = ev.target.closest('[data-action]');
    if (!el || !ev.currentTarget.contains(el)) return;
    if (el.tagName === 'A') ev.preventDefault();
    run(() => handleAction(el.dataset.action, el, ev));
  }
  function onSubmit(ev) {
    const f = ev.target.closest('form[data-form]'); if (!f) return;
    ev.preventDefault();
    const btn = f.querySelector('[type=submit]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    run(() => handleSubmit(f.dataset.form, f)).then(() => { if (btn && document.contains(btn)) btn.disabled = false; });
  }
  function onInput(ev) {
    const el = ev.target;
    if (el.hasAttribute('data-price-q')) { renderPriceResults(el.value); return; }
    if (el.name === 'leafPrice' && el.closest('form[data-form="stdPrices"]')) { const sp = $('#shred-price'); if (sp) sp.textContent = Number(el.value) > 0 ? money(Number(el.value) * 1.5) : '—'; return; }
    if (el.dataset.filter) {
      state.filters[el.dataset.filter] = el.value;
      renderCaseList();
      return;
    }
    if (el.dataset.tpl && state.editTemplate) {
      const t = state.editTemplate; const ci = +el.dataset.ci, ii = +el.dataset.ii;
      if (el.dataset.tpl === 'name') t.name = el.value;
      if (el.dataset.tpl === 'seized') t.requiresSeizedItems = el.checked;
      if (el.dataset.tpl === 'cause') t.cause = el.value;
      if (el.dataset.tpl === 'cat') t.categories[ci].name = el.value;
      if (el.dataset.tpl === 'item') t.categories[ci].items[ii].name = el.value;
      if (el.dataset.tpl === 'req') t.categories[ci].items[ii].required = el.checked;
      return;
    }
    if (ev.type === 'change' && el.dataset.setting) {
      state.settings[el.dataset.setting] = el.checked;
      run(async () => { const s = Object.assign({}, await getJSON(K.settings, true, {}), { [el.dataset.setting]: el.checked }); if (await setJSON(K.settings, s, true)) { state.settings = Object.assign({ watermark: true }, s); toast('已保存设置', 'ok', 1200); } });
      return;
    }
    if (ev.type === 'change' && el.dataset.pref) {
      state.prefs[el.dataset.pref] = el.checked;
      run(async () => { if (await setJSON(K.prefs, state.prefs, false)) toast('已保存设置', 'ok', 1200); });
      return;
    }
    if (modal.kind === 'seized' && state.seizedEdit && el.closest('form[data-form="seized"]')) {
      if (el.name === 'barcode' && ev.type === 'input') onSeizedCodeInput();
      else if (el.name === 'brand') onSeizedBrandInput();
      else if (el.name === 'price') onSeizedPriceInput();
      else if (el.name === 'qty' || el.name === 'unit') { syncSeizedForm(); modalRoot.querySelector('#subtotal').innerHTML = subtotalText(state.seizedEdit); }
    }
  }
  // 查获登记：条码框回车 → 查找并跳到数量；数量框回车 → 保存并继续（适配蓝牙/USB 扫码枪：扫完自动回车）
  modalRoot.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || modal.kind !== 'seized' || !state.seizedEdit) return;
    const n = ev.target.name;
    if (n === 'barcode') { ev.preventDefault(); const ok = onSeizedCodeInput(); focusSeized(ok ? 'qty' : 'brand'); }
    else if (n === 'brand') { ev.preventDefault(); onSeizedBrandInput(); focusSeized('qty'); }
    else if (n === 'spec') { ev.preventDefault(); focusSeized('qty'); }
    else if (n === 'qty' || n === 'price') { ev.preventDefault(); run(() => saveSeized(!state.seizedEdit.id)); }
  });
  [root, modalRoot].forEach(r => {
    r.addEventListener('click', onClick);
    r.addEventListener('submit', onSubmit);
    r.addEventListener('input', onInput);
    r.addEventListener('change', onInput);
  });
  function onFileChosen(ev) {
    const inp = ev.target;
    const file = inp.files && inp.files[0];
    const ctx = state.pendingCapture; state.pendingCapture = null;
    if (!file || !ctx) return;
    ctx.source = inp === albumInput ? 'album' : 'camera';
    run(() => handleCapturedFile(file, ctx)).then(() => { inp.value = ''; });
  }
  cameraInput.addEventListener('change', onFileChosen);
  albumInput.addEventListener('change', onFileChosen);
  $('#catalog-input').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) run(() => importCatalogFile(f)); });
  importInput.addEventListener('change', () => { const f = importInput.files && importInput.files[0]; if (f) run(() => importData(f)); });
  $('#save-banner-close').addEventListener('click', () => { $('#save-banner').hidden = true; });

  // 列表每 30 秒自动刷新（无实时同步）
  setInterval(() => {
    if (state.user && state.view === 'cases' && !modal.kind && !document.hidden) run(() => refreshList(true));
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.user && state.view === 'cases' && !modal.kind) run(() => refreshList(true));
  });

  /* ========================= 启动 ========================= */
  async function loadShared() {
    state.users = await getJSON(K.users, true, []) || [];
    let tpls = await getJSON(K.templates, true, null);
    if (!Array.isArray(tpls) || !tpls.length) {
      tpls = defaultTemplates();
      await setJSON(K.templates, tpls, true);
    }
    state.templates = tpls;
    state.settings = Object.assign({ watermark: true }, await getJSON(K.settings, true, {}));
    state.barcodeDict = await getJSON(K.barcodes, true, {}) || {};
    state.customCatalog = await getJSON(K.priceCatalog, true, null);
    state.index = await getJSON(K.index, true, []) || [];
  }
  async function init() {
    await Store.init();
    await loadShared();
    state.ready = true;
    if (!state.users.length) { go('setup', {}, true); return; }
    const sess = await getJSON(K.session, false, null);
    const u = sess && state.users.find(x => x.id === sess.userId);
    if (u) {
      state.user = u;
      state.prefs = Object.assign({ geo: true }, await getJSON(K.prefs, false, {}));
      state.lastRefresh = Date.now();
      go('cases', {}, true);
    } else go('login', {}, true);
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const est = await navigator.storage.estimate();
        const show = () => { const q = $('#quota'); if (q && est.quota) q.textContent = '约 ' + fmtSize(est.usage || 0) + ' / 可用 ' + fmtSize(est.quota); };
        new MutationObserver(show).observe(root, { childList: true }); show();
      } catch (e) { /* 忽略 */ }
    }
  }

  // 供自动化测试读取的只读接口
  window.__EVIDENCE_APP__ = {
    version: APP_VERSION,
    analyzeImageData, checkGtin, seizedItemValid, safeName,
    get backend() { return Store.backend; },
    get idle() { return running === 0; },
    get state() { return { view: state.view, user: state.user && { id: state.user.id, name: state.user.name, role: state.user.role }, caseId: state.caseId }; }
  };

  render();
  run(init);
})();
</script>
</body>
</html>
