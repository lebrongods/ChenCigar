<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c4a">
<meta name="format-detection" content="telephone=no">
<title>涉烟案件现场证据采集系统</title>
<style>
:root {
  --pri: #1d5c4a; --pri-d: #154637; --pri-l: #e6f0ec;
  --bg: #f2f4f3; --card: #fff; --text: #1c2421; --muted: #66706c; --line: #d9e0dc;
  --danger: #b83227; --danger-l: #fbeaea; --warn: #a86400; --warn-l: #fff4e0;
  --ok: #1e7a45; --ok-l: #e5f5eb; --radius: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
body.modal-open { overflow: hidden; }
img { max-width: 100%; display: block; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 6px 0; }
#view-root { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--pri); color: #fff; display: flex; align-items: center;
  gap: 8px; padding: 6px 12px; min-height: 52px; padding-top: calc(6px + env(safe-area-inset-top)); }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .who { font-size: 13px; opacity: .9; white-space: nowrap; }
.topbar .back { background: transparent; color: #fff; border: 0; font-size: 16px; min-height: 44px; min-width: 44px; padding: 0 6px; cursor: pointer; }
.content { padding: 12px; }
.card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); border: 1px solid var(--line); }
.card.alert-danger { background: var(--danger-l); border-color: #efc2be; }
.card.alert-warn { background: var(--warn-l); border-color: #f0d9a8; }
.card.alert-ok { background: var(--ok-l); border-color: #b9e0c7; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.warn-text { color: var(--warn); }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.pre { white-space: pre-wrap; }
.break { overflow-wrap: anywhere; word-break: break-all; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; min-width: 44px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text);
  font-size: 16px; line-height: 1.2; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.btn:active { filter: brightness(.94); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger-outline { color: var(--danger); border-color: #e3a8a2; }
.btn-sm { min-height: 44px; padding: 6px 10px; font-size: 14px; }
.btn-block { display: flex; width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row > .btn { flex: 1 1 120px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span, .unit-fixed > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
div.field { margin-bottom: 12px; }
input[type=text], input[type=password], input[type=number], input[type=search], input[type=tel], input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff; color: var(--text); font-family: inherit; }
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri); outline-offset: 0; border-color: var(--pri); }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; }
.badge { display: inline-block; font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 10px; background: #eceff0; color: var(--muted); white-space: nowrap; vertical-align: middle; }
.badge.req { background: var(--danger-l); color: var(--danger); }
.badge.opt { background: #eef1f7; color: #4b5b7a; }
.badge.ok { background: var(--ok-l); color: var(--ok); }
.badge.warn { background: var(--warn-l); color: var(--warn); }
.badge.draft { background: #eceff0; color: #4d5652; }
.badge.admin { background: #e8e3f6; color: #4f3a8f; }
.progress { height: 8px; background: #e3e8e5; border-radius: 4px; overflow: hidden; margin: 8px 0; }
.progress .bar { height: 100%; background: var(--pri); }
.progress.done .bar { background: var(--ok); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: #fff; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { flex: 1; min-height: 56px; border: 0; background: transparent; font-size: 15px; color: var(--muted); cursor: pointer; }
.tabbar button.active { color: var(--pri); font-weight: 700; box-shadow: inset 0 3px 0 var(--pri); }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
.actionbar .inner { max-width: 696px; margin: 0 auto; display: flex; gap: 8px; }
.actionbar .btn { flex: 1; }
.case-card { cursor: pointer; }
.case-no { font-size: 16px; overflow-wrap: anywhere; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters .full { grid-column: 1 / -1; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; min-width: 0; }
.tile.missing { border-color: #e7b3ad; background: #fffafa; }
.tile.done { border-color: #b9e0c7; }
.tile.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px #f5b041; } }
.thumb { aspect-ratio: 4 / 3; background: #eef1ef; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.thumb .ph { color: #9aa39f; font-size: 14px; }
.tile-name { font-size: 14px; margin: 6px 0 2px; overflow-wrap: anywhere; }
.tile-actions { display: flex; gap: 6px; margin-top: 6px; }
.tile-actions .btn { flex: 1; padding: 6px 4px; }
.list-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }
.list-item .mini { width: 64px; height: 48px; flex: none; border-radius: 6px; overflow: hidden; background: #eef1ef; }
.list-item .mini img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.list-item.invalid { background: #fffafa; }
.kv { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 8px; font-size: 14px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div { overflow-wrap: anywhere; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.log-line { font-size: 13px; padding: 4px 0; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 56px; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: #fff; margin-bottom: 10px; font-size: 16px; text-align: left; cursor: pointer; color: var(--text); }
.menu-item .desc { display: block; font-size: 13px; color: var(--muted); }
.tpl-cat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.tpl-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.tpl-item .check { min-height: 44px; font-size: 13px; gap: 4px; }
.tpl-item .check input { width: 20px; height: 20px; }
.modal-mask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 560px) { .modal-mask { align-items: center; } }
.modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 560px) { .modal { border-radius: 14px; } }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare figure { margin: 0; }
.compare figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }
.viewer-img { width: 100%; border-radius: 8px; background: #111; min-height: 120px; }
#toast-root { position: fixed; left: 0; right: 0; top: calc(60px + env(safe-area-inset-top)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.toast { max-width: 520px; width: 100%; background: #26312d; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.2); pointer-events: auto; }
.toast.error { background: var(--danger); }
.toast.warn { background: #8a5a00; }
.toast.ok { background: var(--ok); }
#save-banner { position: fixed; left: 0; right: 0; top: 0; z-index: 60; background: var(--danger); color: #fff; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; display: flex; gap: 8px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#save-banner[hidden] { display: none; }
#save-banner .msg { flex: 1; font-size: 14px; }
#save-banner button { background: #fff; color: var(--danger); border: 0; border-radius: 6px; min-height: 44px; min-width: 60px; font-size: 15px; }
#busy { position: fixed; inset: 0; z-index: 80; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; }
#busy[hidden] { display: none; }
#busy .box { background: #26312d; color: #fff; padding: 14px 20px; border-radius: 10px; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.type-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.type-choice label { border: 2px solid var(--line); border-radius: 8px; padding: 10px; min-height: 56px; display: flex; align-items: center; gap: 6px; cursor: pointer; background: #fff; overflow-wrap: anywhere; }
.type-choice input { width: 20px; height: 20px; flex: none; }
.type-choice label:has(input:checked) { border-color: var(--pri); background: var(--pri-l); }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 8px; }
.section-title h2 { margin: 0; }
.match-box { margin: -6px 0 10px; }
.match { padding: 8px 10px; border-radius: 8px; background: #f1f3f2; font-size: 14px; overflow-wrap: anywhere; }
.match.ok { background: var(--ok-l); border: 1px solid #b9e0c7; }
.match.warn { background: var(--warn-l); color: var(--warn); }
.match-list { display: flex; flex-direction: column; gap: 6px; }
.match-pick { justify-content: flex-start; text-align: left; }
.stepper { display: flex; gap: 6px; }
.stepper input { text-align: center; min-width: 0; }
.stepper .btn { flex: none; width: 48px; font-size: 20px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { flex: 1 1 44px; }
.subtotal { background: #f6f7f6; border-radius: 8px; padding: 8px 10px; margin: -4px 0 12px; font-size: 14px; }
.seized-item .grow { line-height: 1.45; }
.kind-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; }
.kind-tabs .btn { padding: 6px 2px; font-size: 14px; }
.kind-tabs .btn.active, .seg .btn.active { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
.seg { display: flex; gap: 8px; }
.seg .btn { flex: 1; }
.unit-fixed { width: 84px; margin-bottom: 12px; }
.unit-fixed > div { min-height: 44px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 8px; background: #f6f7f6; }
.unit-fixed-text { min-height: 44px; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; background: #f6f7f6; }
input.readonly { background: #f3f5f4; color: var(--muted); }
.badge.kind { background: #e8eef9; color: #34507f; }
.quick-nav { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 2px; }
.quick-nav .btn { flex: none; }
.section-title, #sec-log { scroll-margin-top: 64px; }
.chip.active { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
.officer-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 6px; margin-top: 6px; }
.officer-row input[readonly] { background: #f6f7f6; }
.id-msg { margin: -8px 0 10px; }
.qa-card { padding: 10px 12px; border-left: 4px solid #d5dbd8; }
.qa-card.answered { border-left-color: var(--ok); }
.qa-q { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
.qa-no { flex: none; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 13px; background: var(--pri-l); color: var(--pri); font-size: 13px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.qa-qtext { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.qa-a { min-height: 56px; }
.qa-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; justify-content: space-between; }
.qa-hints, .qa-ops { display: flex; flex-wrap: wrap; gap: 6px; }
.qa-ops { margin-left: auto; }
.rec-editor .chips .btn { flex: 0 1 auto; max-width: 100%; }
.body-text { min-height: 180px; }
.rec-editor.locked input, .rec-editor.locked textarea { background: #f3f5f4; color: var(--text); }
.modal.wide { max-width: 760px; }
.doc-page { background: #fff; color: #111; font-family: "SimSun", "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: 15px; line-height: 1.8; padding: 20px 16px; border: 1px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; margin-top: 8px; }
.doc-page.big { font-size: 20px; }
.doc-title { text-align: center; font-size: 1.5em; font-weight: 700; margin-bottom: 6px; }
.doc-line.right { text-align: right; }
.doc-line .u { text-decoration: underline; }
.doc-line .blank { display: inline-block; max-width: 100%; height: 1.2em; border-bottom: 1px solid #333; vertical-align: bottom; }
.doc-para { text-indent: 2em; }
.doc-qa { padding-left: 2em; text-indent: -2em; }
.doc-qa-label { font-weight: 700; }
.doc-blank { height: .8em; }
.doc-footer { margin-top: 16px; padding-top: 8px; border-top: 1px dashed #bbb; font-size: .8em; color: #555; }
.seized-total { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
/* 扫码与图片计数（全屏层，在弹窗之上） */
body.overlay-open { overflow: hidden; }
body.overlay-open .toast { pointer-events: none; } /* 提示不挡住取景和照片上的点按 */
.overlay { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column; }
.scanner { background: #000; color: #fff; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.scanner.failed video, .scanner.failed .scan-aim { display: none; }
.scan-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); }
.scan-title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-engine { font-size: 12px; opacity: .8; white-space: nowrap; }
.scan-aim { position: absolute; left: 50%; top: 40%; width: min(82vw, 440px); height: min(36vw, 190px); transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.95); border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.38); overflow: hidden; }
.scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #ff453a; box-shadow: 0 0 6px #ff453a; animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { top: 12%; } to { top: 88%; } }
.scan-status { position: absolute; left: 16px; right: 16px; top: calc(40% + min(18vw, 95px) + 14px); text-align: center; font-size: 15px; line-height: 1.5; text-shadow: 0 1px 3px #000; }
.scan-status.bad { top: 22%; padding: 14px; border-radius: 10px; background: rgba(255,255,255,.12); text-shadow: none; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px 12px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.65)); }
.scan-bottom .btn, .scan-top .btn { background: rgba(255,255,255,.94); border-color: transparent; }
.scan-bottom .btn.active { background: #ffd54f; }
.counter { background: #151a18; color: #fff; }
.cnt-top { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
.cnt-top strong { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt-tip { padding: 8px 12px; font-size: 14px; line-height: 1.5; background: #26312d; }
.cnt-stage { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #000; }
.cnt-stage canvas { display: block; touch-action: pan-x pan-y; }
.cnt-stage canvas.boxing { touch-action: none; cursor: crosshair; }
.counter, .scanner { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cnt-panel { background: #fff; color: var(--text); padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
.cnt-panel .btn-row { margin-top: 8px; }
.cnt-count { font-size: 15px; overflow-wrap: anywhere; }
.cnt-n { font-size: 28px; font-weight: 700; color: var(--pri); }
.cnt-thr { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.cnt-thr input { flex: 1; min-width: 0; }
.btn-scan { min-height: 52px; font-size: 17px; margin: 4px 0 12px; }
.count-box { margin: -4px 0 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: #f8faf9; }
.count-box .row { margin-bottom: 4px; }
</style>
</head>
<body>
<div id="view-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="save-banner" role="alert" hidden><span class="msg"></span><button type="button" id="save-banner-close">知道了</button></div>
<div id="busy" hidden><div class="box">处理中…</div></div>
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<input type="file" id="album-input" accept="image/*" hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>
<input type="file" id="catalog-input" accept=".csv,text/csv" hidden>

<script>
(function () {
  'use strict';

  /* ========================= 常量 ========================= */
  const APP_VERSION = '2.4.0';
  const PBKDF2_ITER = 100000;
  const LOCK_MAX = 5;
  const LOCK_MS = 30000;
  const PHOTO_MAX = 1280;
  const PHOTO_Q = 0.72;
  const THUMB_MAX = 320;
  const THUMB_Q = 0.6;
  const REFRESH_MS = 30000;
  const GEO_TIMEOUT = 6000;
  // 拍照质量阈值（在长边 480px 的灰度图上计算）；只提示、不拦截
  const QUALITY = { darkMean: 60, darkClip: 0.6, brightMean: 205, brightClip: 0.4, blurVar: 60 };
  const UNITS = ['条', '包', '支', '件'];
  const PIN_RE = /^\d{4,6}$/;
  const K = { templates: 'templates', index: 'case-index', users: 'users', settings: 'settings', barcodes: 'barcode-dict', priceCatalog: 'price-catalog', session: 'current-session', prefs: 'prefs' };
  const caseKey = id => 'case:' + id;
  const photoKey = id => 'photo:' + id;

  /* ========================= 工具函数 ========================= */
  const $ = sel => document.querySelector(sel);
  const root = $('#view-root');
  const modalRoot = $('#modal-root');
  const cameraInput = $('#camera-input');
  const albumInput = $('#album-input');
  const importInput = $('#import-input');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function fmtDate(ts) { return ts ? fmtTime(ts).slice(0, 16) : ''; }
  function stamp(ts) {
    const d = new Date(ts);
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function tzLabel() {
    const off = -new Date().getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    return 'UTC' + sign + pad2(Math.floor(Math.abs(off) / 60)) + ':' + pad2(Math.abs(off) % 60);
  }
  function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function safeName(s) {
    return String(s || '').trim().replace(/[\\/:*?"<>|\s\u0000-\u001f]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').slice(0, 60) || '未命名';
  }
  function fmtGeo(g) { return g ? g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + '（±' + g.acc + ' 米）' : ''; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ========================= 存储层 ========================= */
  // 优先使用宿主提供的 window.storage；没有时退化为本机 IndexedDB；再不行退化为内存（刷新即丢失）
  const Store = (function () {
    let backend = 'memory';
    let db = null;
    const mem = new Map();
    const full = (key, shared) => (shared ? 'S|' : 'P|') + key;
    function hostOk() { return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
    function openDb() {
      return new Promise(resolve => {
        try {
          const req = indexedDB.open('tobacco-evidence', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
          req.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }
    function idb(mode, fn) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', mode);
        const r = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(r.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('aborted'));
      });
    }
    return {
      get backend() { return backend; },
      async init() {
        if (hostOk()) { backend = 'host'; return; }
        if (window.indexedDB) {
          db = await openDb();
          if (db) {
            backend = 'indexeddb';
            try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 忽略 */ }
            return;
          }
        }
        backend = 'memory';
      },
      async get(key, shared) {
        try {
          if (backend === 'host') {
            const r = await window.storage.get(key, shared);
            if (r == null) return null;
            if (typeof r === 'string') return r;
            return r.value == null ? null : r.value;
          }
          if (backend === 'indexeddb') {
            const v = await idb('readonly', s => s.get(full(key, shared)));
            return v == null ? null : v;
          }
          return mem.has(full(key, shared)) ? mem.get(full(key, shared)) : null;
        } catch (e) { return null; }
      },
      async set(key, value, shared) {
        try {
          if (backend === 'host') {
            const r = await window.storage.set(key, value, shared);
            return !(r === null || r === false);
          }
          if (backend === 'indexeddb') { await idb('readwrite', s => s.put(value, full(key, shared))); return true; }
          mem.set(full(key, shared), value);
          return true;
        } catch (e) { return false; }
      },
      async del(key, shared) {
        try {
          if (backend === 'host') { if (window.storage.delete) await window.storage.delete(key, shared); return true; }
          if (backend === 'indexeddb') { await idb('readwrite', s => s.delete(full(key, shared))); return true; }
          mem.delete(full(key, shared));
          return true;
        } catch (e) { return false; }
      },
      // 列出共享区中以 prefix 开头的 key（用于重建索引），不支持时返回 null
      async keys(prefix, shared) {
        try {
          if (backend === 'host') {
            if (typeof window.storage.list !== 'function') return null;
            const r = await window.storage.list(prefix, shared);
            const arr = Array.isArray(r) ? r : (r && r.keys) || [];
            return arr.map(k => typeof k === 'string' ? k : k.key).filter(k => k && k.startsWith(prefix));
          }
          const pre = full(prefix, shared);
          if (backend === 'indexeddb') {
            const all = await idb('readonly', s => s.getAllKeys());
            return all.filter(k => String(k).startsWith(pre)).map(k => String(k).slice(2));
          }
          return [...mem.keys()].filter(k => k.startsWith(pre)).map(k => k.slice(2));
        } catch (e) { return null; }
      }
    };
  })();

  function describeKey(key) {
    if (key.startsWith('photo:')) return '照片';
    if (key.startsWith('case:') || key === K.index) return '案件数据';
    if (key === K.users) return '账号数据';
    if (key === K.templates) return '案件模板';
    if (key === K.barcodes) return '条码库';
    return '系统数据';
  }
  function reportSaveFail(key) {
    const b = $('#save-banner');
    b.querySelector('.msg').textContent = '保存失败：' + describeKey(key) + '未能写入存储，刚才的修改可能没有保存。请检查手机存储空间后重试，并尽快由管理员导出备份。';
    b.hidden = false;
    toast('保存失败：' + describeKey(key) + '未写入存储', 'error', 6000);
  }
  async function getJSON(key, shared, fallback) {
    const raw = await Store.get(key, shared);
    if (raw == null) return fallback;
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  }
  async function setJSON(key, value, shared) {
    const ok = await Store.set(key, JSON.stringify(value), shared);
    if (!ok) reportSaveFail(key);
    return ok;
  }

  /* ========================= 加密（PIN 与摘要） ========================= */
  function hasSubtle() { return !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.digest === 'function'); }
  function toB64(buf) {
    const bytes = new Uint8Array(buf); let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function fromB64(b64) {
    const s = atob(b64); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function toHex(buf) { return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''); }
  async function sha256Hex(data) {
    const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : data;
    return toHex(await crypto.subtle.digest('SHA-256', bytes));
  }
  async function pbkdf2(pin, salt, iter) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256);
    return toB64(bits);
  }
  async function makePinHash(pin) {
    if (!hasSubtle()) throw new Error('当前浏览器不支持 Web Crypto，无法保存 PIN');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    return 'pbkdf2:sha256:' + PBKDF2_ITER + ':' + toB64(salt) + ':' + (await pbkdf2(pin, salt, PBKDF2_ITER));
  }
  function sameStr(a, b) {
    if (a.length !== b.length) return false;
    let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return r === 0;
  }
  // 返回 {ok, upgrade}；识别旧版 sha256: 与 plain: 格式，登录成功后自动升级
  async function verifyPin(user, pin) {
    const h = String(user.pinHash || '');
    if (!hasSubtle()) return { ok: false, error: 'nocrypto' };
    if (h.startsWith('pbkdf2:')) {
      const p = h.split(':');
      const iter = parseInt(p[2], 10);
      const calc = await pbkdf2(pin, fromB64(p[3]), iter);
      const ok = sameStr(calc, p[4]);
      return { ok, upgrade: ok && iter < PBKDF2_ITER };
    }
    if (h.startsWith('sha256:')) {

  function analyzeImageData(data, w, h) {

    for (let i = 0, j = 0; i < n; i++, j += 4) {

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;

        lsum += l; lsq += l * l; cnt++;

  // 截取图像中间 frac 比例的区域，缩到长边 max 以内，可旋转 90°（识别竖放的条码）
  function cropToCanvas(src, W, H, frac, max, rot, cv) {
    const cw = W * frac, ch = H * frac, sx = (W - cw) / 2, sy = (H - ch) / 2;
    const k = Math.min(1, max / Math.max(cw, ch));
    const ow = Math.max(1, Math.round(cw * k)), oh = Math.max(1, Math.round(ch * k));
    cv = cv || document.createElement('canvas');
    cv.width = rot ? oh : ow; cv.height = rot ? ow : oh;
    const x = cv.getContext('2d', { willReadFrequently: true });
    x.setTransform(1, 0, 0, 1, 0, 0);
    if (rot) { x.translate(cv.width, 0); x.rotate(Math.PI / 2); }
    x.drawImage(src, sx, sy, cw, ch, 0, 0, ow, oh);
    return cv;
  }
  // 从照片识别条码：依次尝试不同缩放、居中裁切和旋转 90°
  async function tryDetectBarcode(file) {
    if (!barcodeSupported()) return { error: 'unsupported' };
    let src;
    try { src = await loadImageFromFile(file); } catch (e) { return { error: 'failed', message: e.message }; }
    try {
      const { w, h } = dims(src);
      for (const [frac, max, rot] of [[1, 1600, 0], [1, 1000, 0], [0.6, 1200, 0], [1, 1600, 90], [0.6, 1200, 90]]) {
        const r = await decodeCanvas(cropToCanvas(src, w, h, frac, max, rot), true, true);
        if (r) return r;
      }
      return { error: 'notfound' };
    } catch (e) { return { error: 'failed', message: e.message }; } finally { if (src.close) try { src.close(); } catch (e) { /* 忽略 */ } }
  }
  // GTIN（EAN-8/UPC-A/EAN-13/ITF-14）校验位；非此类条码返回 null
  function checkGtin(code) {
    if (!/^\d+$/.test(code) || ![8, 12, 13, 14].includes(code.length)) return null;
    const d = code.split('').map(Number); const check = d.pop();
    let sum = 0; d.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
    return (10 - (sum % 10)) % 10 === check;
  }

    const std = c.seizedItems.filter(x => x.priceSource === 'standard' && Number(x.price) > 0);

  function xmlEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ''); }
  function colName(i) { return String.fromCharCode(65 + i); }
  function buildPriceSheetData(c) {
    const lines = c.seizedItems.map(priceLine);
    const units = [...new Set(lines.map(p => p.pUnit))];
    const unitCount = {}; lines.forEach(p => { unitCount[p.pUnit] = (unitCount[p.pUnit] || 0) + 1; });
    const headUnit = units.includes('条') || !units.length ? '条' : units.sort((a, b) => unitCount[b] - unitCount[a])[0];
    const qtyHead = '数量(' + headUnit + ')';
    const d = c.filingDate ? new Date(c.filingDate + 'T00:00:00') : null;
    const dateText = d && !isNaN(d) ? ' ' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日' : '      年    月    日';
    const numText = /^临-/.test(c.number) ? '             ' : c.number;
    const org = orgName();
    const rows = c.seizedItems.map((s, i) => {
      const p = lines[i];
      const notes = p.notes.slice();
      if (p.pUnit !== headUnit) notes.unshift('单位：' + p.pUnit);
      return { no: i + 1, name: s.brand, qty: p.pq, price: p.price, amount: p.amount, note: notes.join('；'), code: s.barcode || '' };
    });
    // 不同计量单位的数量不能相加：合计只算表头单位，其余按单位分别注明
    const otherSum = {};
    rows.forEach((x, i) => { const u = lines[i].pUnit; if (u !== headUnit && x.qty != null) otherSum[u] = Math.round(((otherSum[u] || 0) + x.qty) * 1000) / 1000; });
    const other = Object.keys(otherSum);
    return {
      org, title: org + '\n涉案烟草专卖品核价表',
      sentence: '    ' + org + '于' + dateText + '立案（立案编号：' + numText + '）的 ' + (caseCause(c) || '            ') + ' 案件中，涉案物品价格如下：',
      qtyHead, rows,
      headUnit,
      totalQty: Math.round(rows.filter((x, i) => lines[i].pUnit === headUnit).reduce((a, r) => a + (r.qty || 0), 0) * 1000) / 1000,
      mixed: other.length > 0,
      totalNote: other.length ? '另有 ' + other.map(u => otherSum[u] + ' ' + u).join('、') + '未计入' : '',

  function orgName() { return (state.settings.priceOrg || '').trim() || '桂阳县烟草专卖局'; }

  // 涉案物品清单文字，如"卷烟2个品规（中华（硬）20条、利群（新版）29条），共计49条；烟叶30公斤"

    const parts = [];
    if (cig.length) {

      cig.forEach(s => { const u = s.unit || '条'; sum[u] = Math.round(((sum[u] || 0) + Number(s.qty)) * 1000) / 1000; });
      parts.push('卷烟' + cig.length + '个品规（' + cig.map(s => s.brand + s.qty + (s.unit || '条')).join('、') + '），共计' + Object.keys(sum).map(u => sum[u] + u).join(''));

  function officerNames(r) { return (r.officers || []).map(o => o.name).filter(Boolean).join('、'); }

  function firstActivityTime(c) {

  function recordCtx(c, r) {

  function fillVars(text, ctx) { return String(text || '').replace(/\{(单位|执法人员|案由|日期|地点|当事人|物品清单)\}/g, (m, k) => ctx[k] || ''); }

  function blankPerson(name) { return { name: name || '', gender: '', birth: '', ethnic: '', idNo: '', job: '', address: '', phone: '' }; }
  function createRecord(type, c) {

  // 定稿 / 生成前的完整性提示（只提示，不强制）

  // 现场情况草稿：由检查要素、涉案物品、照片数量、处理措施自动组成，生成后可自由修改
  function factVal(r, f) {

  function sceneModel(c, r) {

  /* ---------- Word（.docx）输出：A4，宋体，每页页脚带签名栏和页码 ---------- */
  const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const R_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const DOCX_FONT = '宋体';
  function wRun(text, o) {
    o = o || {};
    const sz = o.sz || 28;
    // rPr 子元素须按 OOXML 规定顺序：rFonts, b, bCs, sz, szCs, u
    const rpr = '<w:rPr><w:rFonts w:ascii="' + DOCX_FONT + '" w:eastAsia="' + DOCX_FONT + '" w:hAnsi="' + DOCX_FONT + '" w:cs="' + DOCX_FONT + '"/>' +
      (o.b ? '<w:b/><w:bCs/>' : '') + '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/>' + (o.u ? '<w:u w:val="single"/>' : '') + '</w:rPr>';
    return String(text == null ? '' : text).split('\n').map((t, i) => '<w:r>' + rpr + (i ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + xmlEsc(t) + '</w:t></w:r>').join('');
  }
  function wPara(runs, o) {
    o = o || {};
    // pPr 子元素顺序：keepNext, spacing, ind, jc
    let ppr = (o.keepNext ? '<w:keepNext/>' : '') + '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0) + '" w:line="' + (o.line || 360) + '" w:lineRule="auto"/>';
    if (o.ind) ppr += '<w:ind' + Object.keys(o.ind).map(k => ' w:' + k + '="' + o.ind[k] + '"').join('') + '/>';
    if (o.jc) ppr += '<w:jc w:val="' + o.jc + '"/>';
    return '<w:p><w:pPr>' + ppr + '</w:pPr>' + runs + '</w:p>';
  }
  function blockXml(b) {
    if (b.type === 'title') return wPara(wRun(b.text, { sz: 44, b: true }), { jc: 'center', after: 240 });
    if (b.type === 'blank') return wPara('', { line: 240 });
    if (b.type === 'heading') return wPara(wRun(b.text, { b: true }), { keepNext: true });
    if (b.type === 'para') return wPara(wRun(b.text), { ind: { firstLine: 560 } });
    if (b.type === 'qa') return wPara(wRun(b.label + '：', { b: b.label === '问' }) + wRun(b.text), { ind: { left: 560, hanging: 560 } });
    return wPara(b.runs.map(x => wRun(x.text, { u: x.u, b: x.b })).join(''), { jc: b.type === 'right' ? 'right' : undefined, keepNext: !!b.keep });

  async function modelDocx(m) {
    const xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const fr = t => wRun(t, { sz: 21 });

      '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>' + fr('第 ') +
      '<w:fldSimple w:instr=" PAGE ">' + fr('1') + '</w:fldSimple>' + fr(' 页　共 ') + '<w:fldSimple w:instr=" NUMPAGES ">' + fr('1') + '</w:fldSimple>' + fr(' 页') + '</w:p></w:ftr>';
    const doc = xml + '<w:document xmlns:w="' + W_NS + '" xmlns:r="' + R_NS + '"><w:body>' + m.blocks.map(blockXml).join('') +
      '<w:sectPr><w:footerReference w:type="default" r:id="rId3"/><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1304" w:bottom="1701" w:left="1474" w:header="851" w:footer="851" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const styles = xml + '<w:styles xmlns:w="' + W_NS + '"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="' + DOCX_FONT + '" w:eastAsia="' + DOCX_FONT + '" w:hAnsi="' + DOCX_FONT + '" w:cs="' + DOCX_FONT + '"/>' +
      '<w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="en-US" w:eastAsia="zh-CN" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
    const settings = xml + '<w:settings xmlns:w="' + W_NS + '"><w:zoom w:percent="100"/><w:defaultTabStop w:val="420"/><w:characterSpacingControl w:val="compressPunctuation"/>' +
      '<w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>';

      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>' +
      '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>');
    zip.file('_rels/.rels', xml + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file('word/_rels/document.xml.rels', xml + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>');
    zip.file('word/document.xml', doc);

  /* ========================= 视图：案件列表 ========================= */
  function visibleCases() {
    const f = state.filters; const q = f.q.trim().toLowerCase();
    return state.index.filter(e => canSeeCase(e)).filter(e => {
      if (f.type && e.typeId !== f.type) return false;
      if (f.status) {
        const st = statusOf(e).text;
        if (f.status === 'draft' && e.status !== 'draft') return false;
        if (f.status === 'complete' && !(e.status === 'complete' && !e.lastPackagedAt)) return false;
        if (f.status === 'packaged' && st !== '已打包') return false;
        if (f.status === 'dirty' && st !== '打包后有修改') return false;
      }
      if (f.assignee) {
        if (f.assignee === '__none' ? !!e.assignedTo : e.assignedTo !== f.assignee) return false;
      }
      if (q) {
        const hay = [e.number, e.typeName, e.party, e.address, e.note, nameOf(e.assignedTo), nameOf(e.createdBy)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }

  /* ========================= 视图：案件详情 ========================= */
  function viewCase() {
    const c = state.caseData;
    if (!c) return topbar('案件', 'cases') + '<div class="content"><div class="empty">正在读取案件…</div></div>';
    const s = caseStats(c); const e = indexEntry(c); const st = statusOf(e);
    const pct = s.reqTotal ? Math.round(s.reqDone / s.reqTotal * 100) : 100;
    let html = topbar(c.number, 'cases') + '<div class="content">' + wechatNotice();
    html += '<div class="card"><div class="row between nowrap"><h2 class="grow break">' + esc(c.number) + '</h2><span class="badge ' + st.cls + '">' + st.text + '</span></div>' +
      '<div class="kv"><div>案件类型</div><div>' + esc(c.typeName) + '</div>' +
      '<div>承办人</div><div>' + (c.assignedTo ? esc(nameOf(c.assignedTo)) : '<span class="warn-text">未分配</span>') + '</div>' +
      '<div>创建人</div><div>' + esc(c.createdByName || nameOf(c.createdBy)) + ' · ' + fmtDate(c.createdAt) + '</div>' +
      (c.address ? '<div>现场地址</div><div>' + esc(c.address) + '</div>' : '') +
      (c.party ? '<div>当事人</div><div>' + esc(c.party) + '</div>' : '') +
      (c.note ? '<div>备注</div><div class="pre">' + esc(c.note) + '</div>' : '') +
      (c.lastPackagedAt ? '<div>最近打包</div><div>' + fmtTime(c.lastPackagedAt) + '</div>' : '') + '</div>' +
      '<div class="progress' + (pct === 100 ? ' done' : '') + '"><div class="bar" style="width:' + pct + '%"></div></div>' +
      '<div class="small" id="case-progress">必拍 ' + s.reqDone + '/' + s.reqTotal + ' · 选拍 ' + s.optDone + '/' + s.optTotal + ' · 涉案物品 ' + s.seizedCount + ' 项' + ((c.records || []).length ? ' · 笔录 ' + c.records.length + ' 份' : '') + '</div>' +
      '<div class="btn-row"><button type="button" class="btn btn-sm" data-action="edit-info">编辑信息</button>' +
      (isAdmin() ? '<button type="button" class="btn btn-sm" data-action="assign-case" data-id="' + esc(c.id) + '">' + (c.assignedTo ? '重新分配' : '分配承办人') + '</button>' : '') +
      '<button type="button" class="btn btn-sm" data-action="reload-case">刷新</button></div></div>';
    if (st.text === '打包后有修改') html += '<div class="card alert-warn small">证据包生成后本案又有修改，请重新生成证据包。</div>';
    html += '<nav class="quick-nav" aria-label="快速跳转">' + [['sec-photos', '照片'], ['sec-items', '涉案物品'], ['sec-records', '笔录'], ['sec-extras', '补充照片'], ['sec-log', '日志']]
      .map(x => '<button type="button" class="btn btn-sm" data-action="jump" data-to="' + x[0] + '">' + x[1] + '</button>').join('') + '</nav>';
    html += packResultHtml();
    c.template.categories.forEach((cat, ci) => {
      html += '<div class="section-title"' + (ci === 0 ? ' id="sec-photos"' : '') + '><h2>' + esc(cat.name) + '</h2></div><div class="tiles">' + cat.items.map(it => itemTileHtml(c, it)).join('') + '</div>';
    });
    html += seizedSectionHtml(c);
    html += recordsSectionHtml(c);
    html += extrasSectionHtml(c);
    html += '<div class="card" id="sec-log" style="margin-top:16px"><details><summary>操作日志（' + c.log.length + ' 条）</summary>' +
      c.log.slice().reverse().map(l => '<div class="log-line">' + fmtTime(l.at) + ' · ' + esc(l.byName) + ' · ' + esc(l.action) + (l.detail ? '：' + esc(l.detail) : '') + '</div>').join('') + '</details></div>';
    if (canDeleteCase(c)) html += '<button type="button" class="btn btn-danger-outline btn-block" data-action="delete-case">删除本案件</button>';
    html += '</div><div class="actionbar"><div class="inner"><button type="button" class="btn btn-primary" data-action="package">校验并生成证据包</button></div></div>';
    return html;
  }
  function itemTileHtml(c, it) {
    const ev = c.evidence[it.id]; const has = hasPhoto(ev);
    const issues = has && ev.quality && ev.quality.issues && ev.quality.issues.length ? ev.quality.issues : null;
    return '<div class="tile ' + (has ? 'done' : (it.required ? 'missing' : '')) + '" id="item-' + esc(it.id) + '" data-item-id="' + esc(it.id) + '">' +
      '<div class="thumb">' + (has ? '<img src="' + thumbOf(ev) + '" alt="' + esc(it.name) + '" data-action="view-photo" data-kind="evidence" data-item="' + esc(it.id) + '">' : '<span class="ph">未拍</span>') + '</div>' +
      '<div class="tile-name">' + esc(it.name) + ' <span class="badge ' + (it.required ? 'req' : 'opt') + '">' + (it.required ? '必拍' : '选拍') + '</span></div>' +
      (issues ? '<div class="warn-text small">⚠ ' + esc(issues.join('、')) + '，建议重拍</div>' : '') +
      (has ? '<div class="muted small">' + fmtTime(ev.capturedAt).slice(5) + (ev.geo ? ' · 已定位' : '') + '</div>' : '') +
      '<div class="tile-actions"><button type="button" class="btn btn-sm btn-primary" data-action="capture" data-src="camera" data-kind="evidence" data-item="' + esc(it.id) + '">' + (has ? '重拍' : '拍照') + '</button>' +
      '<button type="button" class="btn btn-sm" data-action="capture" data-src="album" data-kind="evidence" data-item="' + esc(it.id) + '">相册</button></div></div>';
  }
  function seizedSummary(items) {
    const sum = {};
    items.filter(seizedItemValid).forEach(s => { sum[s.unit || '条'] = (sum[s.unit || '条'] || 0) + Number(s.qty); });
    return Object.keys(sum).map(u => (Math.round(sum[u] * 100) / 100) + ' ' + u).join('，');
  }
  function seizedSectionHtml(c) {
    const req = c.template.requiresSeizedItems;
    let html = '<div class="section-title" id="sec-items"><h2>涉案物品录入' + (req ? ' <span class="badge req">必填</span>' : '') + '</h2>' +
      '<div class="row"><button type="button" class="btn btn-sm btn-primary" data-action="seized-scan">扫码录入</button><button type="button" class="btn btn-sm" data-action="seized-add">＋ 登记</button></div></div><div class="card" id="seized-list">';
    if (!c.seizedItems.length) {
      html += '<div class="muted small">' + (req ? '本类案件须登记涉案物品（卷烟、烟叶、烟丝、空管烟、电子烟等）的名称和数量，未登记无法生成证据包。' : '如有涉案物品请登记。') + '</div>';
    } else {
      html += c.seizedItems.map((s, i) => {
        const valid = seizedItemValid(s);
        const p = priceLine(s);
        const priceText = p.hasPrice ? '单价 ' + p.price + ' 元/' + p.pUnit + (p.amount != null ? ' · 小计 <strong>' + fmtMoney(p.amount) + '</strong> 元' : '') + (s.priceSource === 'manual' ? ' <span class="badge warn">手工价</span>' : '') + (s.priceExit ? ' <span class="badge warn">退出目录</span>' : '')
          : '<span class="warn-text">未核价</span>';
        return '<div class="list-item seized-item' + (valid ? '' : ' invalid') + '">' +
          (s.thumb ? '<div class="mini"><img src="' + s.thumb + '" alt="" data-action="view-photo" data-kind="seized" data-item="' + esc(s.id) + '"></div>' : '') +
          '<div class="grow"><div>' + ((s.kind || 'cigarette') !== 'cigarette' && !String(s.brand || '').startsWith(kindOf(s.kind).label) ? '<span class="badge kind">' + esc(kindOf(s.kind).label) + '</span> ' : '') + '<strong>' + (i + 1) + '. ' + (s.brand ? esc(s.brand) : '<span class="danger-text">品规未填</span>') + '</strong> ' +
          (Number(s.qty) > 0 ? esc(s.qty) + ' ' + esc(s.unit || '条') : '<span class="danger-text">数量未填</span>') + '</div>' +
          '<div class="small">' + priceText + '</div>' +
          (p.pq == null && Number(s.qty) > 0 && p.hasPrice ? '<div class="warn-text small">' + esc(p.notes[0] || '') + '</div>' : '') +
          ((s.kind || 'cigarette') === 'cigarette' ? '<div class="muted small break">条码：' + (s.barcode ? esc(s.barcode) : '—') + '</div>' : '') +
          (s.countNote ? '<div class="muted small">' + esc(countNoteDisplay(s)) + '</div>' : '') +
          (valid ? '' : '<div class="danger-text small">信息不完整，打包前需补全</div>') + '</div>' +
          '<button type="button" class="btn btn-sm" data-action="seized-edit" data-id="' + esc(s.id) + '">编辑</button></div>';
      }).join('');
      const amt = caseAmount(c.seizedItems);
      html += '<div class="seized-total"><div>数量合计：' + (seizedSummary(c.seizedItems) || '—') + '</div>' +
        '<div>涉案金额：<strong>' + fmtMoney(amt.total) + '</strong> 元' + (amt.priced < amt.count ? '<span class="warn-text small">（' + (amt.count - amt.priced) + ' 项未核价）</span>' : '') + '</div></div>' +
        '<button type="button" class="btn btn-block" data-action="price-sheet" style="margin-top:8px">生成核价表（Excel）</button>';
    }
    return html + '</div>';
  }
  function extrasSectionHtml(c) {
    let html = '<div class="section-title" id="sec-extras"><h2>补充照片 <span class="badge opt">可选</span></h2><div class="row">' +
      '<button type="button" class="btn btn-sm" data-action="capture" data-src="camera" data-kind="extra">拍照</button>' +
      '<button type="button" class="btn btn-sm" data-action="capture" data-src="album" data-kind="extra">相册</button></div></div>';
    if (!c.extras.length) return html + '<div class="card muted small">清单以外需要补充的现场照片可在此添加，会一并打入证据包。</div>';
    return html + '<div class="card">' + c.extras.map((x, i) => '<div class="list-item"><div class="mini"><img src="' + x.thumb + '" alt="" data-action="view-photo" data-kind="extra" data-item="' + esc(x.id) + '"></div>' +

  }
  function packResultHtml() {
    const r = state.packResult;
    if (!r) return '';
    if (r.ok) {
      const canShare = state.lastPackage && navigator.canShare && (() => { try { return navigator.canShare({ files: [state.lastPackage.file] }); } catch (e) { return false; } })();
      return '<div class="card alert-ok" id="pack-result"><strong>证据包已生成</strong><div class="small break">' + esc(r.filename) + '（' + fmtSize(r.size) + '，照片 ' + r.photos + ' 张）</div>' +
        (r.sheet ? '<div class="small break">含核价表：' + esc(r.sheet) + '（涉案金额 ' + fmtMoney(r.amount) + ' 元）</div>' : '') +
        (r.records ? '<div class="small">含笔录 ' + r.records + ' 份（Word）</div>' : '') +
        (r.recDrafts ? '<div class="small warn-text">提示：有 ' + r.recDrafts + ' 份笔录尚未定稿，文件名已标"草稿"。</div>' : '') +
        (r.unpriced ? '<div class="small warn-text">提示：有 ' + r.unpriced + ' 项涉案物品未核价，核价表中已标"待核"。</div>' : '') +
        (r.optionalMissing ? '<div class="small warn-text">提示：有 ' + r.optionalMissing + ' 个选拍项未拍（不影响打包）。</div>' : '') +
        '<div class="btn-row"><button type="button" class="btn btn-sm" data-action="download-again">再次下载</button>' +
        (canShare ? '<button type="button" class="btn btn-sm btn-primary" data-action="share-package">发送/分享</button>' : '') + '</div></div>';
    }
    return '<div class="card alert-danger" id="pack-result"><strong>' + esc(r.title) + '</strong>' +
      (r.items && r.items.length ? '<ul class="small" style="padding-left:20px;margin:6px 0">' + r.items.map(x => '<li>' + (x.itemId ? '<a href="#" data-action="goto-item" data-item="' + esc(x.itemId) + '">' + esc(x.text) + '</a>' : esc(x.text)) + '</li>').join('') + '</ul>' : '') +
      (r.detail ? '<div class="small">' + esc(r.detail) + '</div>' : '') + '</div>';
  }

  // 解析价格目录 CSV（支持 UTF-8 与 Excel 默认的 GBK 编码）
  function parseCsv(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
  }
  function catalogFromCsv(text) {
    const rows = parseCsv(text);
    const hi = rows.findIndex(r => r.some(x => /条码|条形码/.test(x)) && r.some(x => /零售价/.test(x)));
    if (hi < 0) throw new Error('找不到表头：需要包含"条码/条包条形码"和"建议零售价"列');
    const h = rows[hi];
    const col = re => h.findIndex(x => re.test(x));
    const ci = { code: col(/条码|条形码/), name: col(/规格名称|品规|品种规格|名称/), retail: col(/零售价/), unit: col(/^单位/), maker: col(/工业公司|生产/), cat: col(/目录|类别/) };
    if (ci.name < 0) throw new Error('找不到"规格名称"列');
    const items = []; const seen = new Set(); const bad = [];
    rows.slice(hi + 1).forEach((r, i) => {
      const code = (r[ci.code] || '').replace(/\D/g, '');
      const retail = Number(String(r[ci.retail] || '').replace(/[,，元\s]/g, ''));
      if (!/^\d{8,14}$/.test(code) || !r[ci.name] || !(retail > 0)) { if (r.join('').trim() && !/序号/.test(r.join(''))) bad.push(hi + i + 2); return; }
      if (seen.has(code)) return;
      seen.add(code);
      items.push({ code, name: r[ci.name], maker: ci.maker >= 0 ? r[ci.maker] || '' : '', cat: ci.cat >= 0 ? r[ci.cat] || '' : '', cls: '', retail, unit: ci.unit >= 0 && /支/.test(r[ci.unit] || '') ? '支' : '条' });
    });
    return { items, bad };
  }
  async function importCatalogFile(file) {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('gbk').decode(buf); } catch (e) { /* 保持 UTF-8 */ } }
    let r;
    try { r = catalogFromCsv(text.replace(/^﻿/, '')); } catch (e) { toast('导入失败：' + e.message, 'error', 6000); return; }
    if (!r.items.length) { toast('导入失败：没有读到有效的品规行', 'error'); return; }
    const version = await promptDialog('价格目录名称', '例如：2026年上半年湖南省卷烟品牌价格目录', '');
    if (version === false || version == null) return;
    const ok = await confirmDialog('读到 ' + r.items.length + ' 个品规' + (r.bad.length ? '，另有 ' + r.bad.length + ' 行格式不对已跳过（第 ' + r.bad.slice(0, 8).join('、') + (r.bad.length > 8 ? '…' : '') + ' 行）' : '') + '。\n导入后将替换当前价格目录，之后登记的卷烟按新价格带出；已登记的不受影响。', { title: '确认导入', okText: '导入' });
    if (!ok) return;
    const cat = { title: version.trim() || file.name, version: version.trim(), issued: '', items: r.items, importedAt: Date.now(), importedBy: state.user.name };
    if (await setJSON(K.priceCatalog, cat, true)) { state.customCatalog = cat; toast('已导入价格目录：' + r.items.length + ' 个品规', 'ok'); render(); }
  }

  // 切换到非卷烟类型时：固定单位、带出标准价

    const k = kindOf(s.kind);
    Object.assign(s, { unit: k.unit, priceUnit: k.unit, barcode: '', matchedCode: '', matched: '', priceCat: '', priceExit: false, catalogPrice: null, cands: null, barcodeMsg: '' });
    const std = stdPriceFor(s.kind, s.sub);
    s.catalogPrice = std;
    s.price = std == null ? '' : String(std);

      unit: s.unit || '条', price: s.price == null ? '' : String(s.price), priceUnit: s.priceUnit || '条', priceSource: s.priceSource || '', priceCat: s.priceCat || '',

      matched: s.priceSource === 'catalog' || s.priceSource === 'local' ? s.priceSource : '', thumb: s.thumb || ''

    if (ev.target.tagName !== 'CANVAS' || counter.mode !== 'check') return;
    // 核对：点已计数的标记 → 剔除；点已剔除的 → 恢复；点人工补的 → 撤销；点空白处 → 补一个
    const p = counterPoint(ev); const m = counterMarks(); const t = counterTpl();
    const inside = bx => p.x >= bx.x && p.x <= bx.x + bx.w && p.y >= bx.y && p.y <= bx.y + bx.h;
    const near = (bx, f) => Math.hypot(p.x - (bx.x + bx.w / 2), p.y - (bx.y + bx.h / 2)) <= Math.min(bx.w, bx.h) * f;
    const add = m.added.find(a => near(a, 0.5));
    if (add) { counter.added = counter.added.filter(q => q !== add.p); renderCounter(); return; }
    const rem = m.removed.find(inside);
    if (rem) { counter.removed = counter.removed.filter(q => !(q.x >= rem.x && q.x <= rem.x + rem.w && q.y >= rem.y && q.y <= rem.y + rem.h)); renderCounter(); return; }
    const hit = m.kept.find(inside);
    if (hit) { counter.removed.push({ x: hit.x + hit.w / 2, y: hit.y + hit.h / 2 }); renderCounter(); return; }
    counter.added.push({ x: Math.min(counter.W - t.w / 2, Math.max(t.w / 2, p.x)), y: Math.min(counter.H - t.h / 2, Math.max(t.h / 2, p.y)) });
    renderCounter();
  }
  // 生成带编号标记的计数照片（顶部注明计数结果），交给调用方
  async function finishCounter(mode) {
    if (!counter.el) return;
    const m = counterMarks(); const n = m.all.length; if (!n) return;
    const opts = counter.opts; const unit = opts.unit || '条';
    const cv = document.createElement('canvas'); cv.width = counter.W; cv.height = counter.H;
    const x = cv.getContext('2d'); x.drawImage(counter.img, 0, 0);
    const u = Math.max(1, Math.min(counter.W, counter.H) / 700);
    drawMarks(x, m, 1, u);
    const fs = Math.round(Math.max(16, Math.min(counter.W, counter.H) * 0.032));
    const text = '图片计数：' + n + ' ' + unit + '（' + counterResultText(m) + '）' + (opts.brand ? '　' + opts.brand : '');
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, counter.W, Math.round(fs * 1.9));
    x.fillStyle = '#fff'; x.font = 'bold ' + fs + 'px -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif'; x.textBaseline = 'middle';
    x.fillText(text, Math.round(fs * 0.6), Math.round(fs * 0.95), counter.W - fs * 1.2);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
    const file = new File([blob], 'count.jpg', { type: 'image/jpeg', lastModified: Date.now() });
    const result = { n, auto: m.kept.length + m.removed.length, added: m.added.length, removed: m.removed.length, mode: mode === 'add' ? 'add' : 'replace', file, source: opts.source };
    closeCounter();
    if (opts.onDone) await opts.onDone(result);
  }

    showBusy('正在处理照片…');
    let p;
    try { p = await processPhoto(file, { caseNumber: c.number, label, source: ctx.source }); } finally { hideBusy(); }

    if (ctx.kind === 'seizedPhoto') {
      const s = state.seizedEdit;
      // 换拍物品照片时，原来作为物品照片的计数照片改存为补充照片，不丢弃

    }

      if (caption === false || caption == null) { toast('已取消，照片未保存'); return; }

  async function handleBarcodeFile(file) {

      const m = lookupCode(r.value);
      if (m.length === 1) applyMatch(m[0]);
      else { clearMatch(); s.barcodeMsg = '已识别条码，但价格目录和条码库中没有该条码：请确认扫的是"条"包装上的条码，或手工填写品规和单价'; }

        try {
          const p = await processPhoto(file, { caseNumber: state.caseData.number, label: '涉案物品 ' + (s.brand || r.value), source: 'camera' });

    } else {
      s.barcodeMsg = r.error === 'notfound' ? '未识别到条码：请让条码横放、占满画面中间、对好焦后重拍，或直接输入条码后 6 位' : r.error === 'unsupported' ? '当前浏览器无法识别条码，请输入条码后 6 位' : '条码识别失败，请输入条码后 6 位';

  async function saveSeized(next) {
    syncSeizedForm();
    const s = state.seizedEdit; const c = state.caseData;
    const msg = modalRoot.querySelector('#seized-msg');
    const cig = (s.kind || 'cigarette') === 'cigarette';
    if (cig && !s.brand && !s.qty && !s.barcode) { msg.textContent = '请至少填写条码、品规或数量'; return; }
    if (!cig && !s.qty) { msg.textContent = '请填写数量'; return; }
    const code = cig ? (s.matchedCode || s.barcode) : '';
    const price = s.price === '' ? '' : Number(s.price);
    const item = {
      id: s.id || uid(), kind: s.kind || 'cigarette', brand: cig ? s.brand : itemName(s.kind, s.sub, s.spec), qty: s.qty === '' ? '' : Number(s.qty), unit: s.unit || '条', barcode: code,
      price, priceUnit: s.priceUnit || '条', priceSource: price === '' ? '' : (s.priceSource || 'manual'), priceCat: s.priceSource === 'catalog' ? s.priceCat : '',
      priceExit: s.priceSource === 'catalog' && !!s.priceExit, priceVersion: s.priceSource === 'catalog' ? activeCatalog().version : ''
    };
    if (!cig) Object.assign(item, { sub: s.kind === 'ecig' ? s.sub : '', spec: s.spec });
    // 本次图片计数结果（数量依据）
    const parts = s.countParts || [];
    const countNote = parts.length ? countNoteText(parts, item.unit) : '';
    if (parts.length) Object.assign(item, { countNote, countTotal: Math.round(parts.reduce((a, p) => a + p.n, 0) * 1000) / 1000 });
    const countLog = countNote ? '；' + countNote + (Number(item.qty) !== item.countTotal ? '，登记数量人工改为 ' + item.qty + item.unit : '') : '';
    // 同一品规（卷烟看条码，其他物品看名称）、同一单位已登记过：询问是否合并数量
    let mergeInto = null;
    if (!s.id && (code || !cig) && Number(item.qty) > 0) {
      const dup = c.seizedItems.find(x => (cig ? x.barcode === code : (x.kind === item.kind && x.brand === item.brand && Number(x.price) === Number(item.price))) && (x.unit || '条') === item.unit && Number(x.qty) > 0);
      if (dup) {
        const snapshot = Object.assign({}, s);
        const ok = await confirmDialog('本案已登记"' + (dup.brand || code) + '" ' + dup.qty + ' ' + dup.unit + '。\n是否把本次的 ' + item.qty + ' ' + item.unit + ' 合并为 ' + (Number(dup.qty) + Number(item.qty)) + ' ' + item.unit + '？', { title: '重复品规', okText: '合并数量', cancelText: '另起一行' });
        state.seizedEdit = snapshot;
        if (ok) mergeInto = dup.id;
      }
    }
    let photo = null;
    if (s.newPhoto) {
      const photoId = await storePhoto(s.newPhoto); if (!photoId) { if (!modalRoot.querySelector('form[data-form="seized"]')) renderSeizedModal(false); return; }
      photo = photoRecord(s.newPhoto, photoId);
    }
    // 物品已有照片时，计数照片存为补充照片
    const extraRecs = [];
    for (const e of (s.extraPhotos || [])) {
      const pid = await storePhoto(e.p); if (!pid) { if (!modalRoot.querySelector('form[data-form="seized"]')) renderSeizedModal(false); return; }
      extraRecs.push(Object.assign(photoRecord(e.p, pid), { id: uid(), caption: '图片计数：' + (item.brand || code || kindLabelOf(item)) + ' ' + e.n + item.unit }));
    }
    let oldPhotoId = null;
    const addExtras = cc => extraRecs.forEach(x => { cc.extras.push(x); addLog(cc, '添加补充照片', x.caption); });
    const saved = await mutateCase(c.id, cc => {
      if (mergeInto) {
        const t = cc.seizedItems.find(x => x.id === mergeInto);
        if (t) {
          const before = t.qty;
          t.qty = Math.round((Number(t.qty) + Number(item.qty)) * 1000) / 1000;
          if (photo && !t.photoId) Object.assign(t, { photoId: photo.photoId, thumb: photo.thumb, capturedAt: photo.capturedAt, sha256: photo.sha256, geo: photo.geo, source: photo.source });
          else if (photo) extraRecs.unshift(Object.assign({}, photo, { id: uid(), caption: '涉案物品：' + (t.brand || code) + '（合并登记）' }));
          if (countNote) { t.countNote = (t.countNote ? t.countNote + '；' : '') + '合并登记部分：' + countNote; t.countTotal = null; }
          addLog(cc, '合并涉案物品数量', (t.brand || code) + ' ' + before + ' + ' + item.qty + ' = ' + t.qty + t.unit + countLog);
          addExtras(cc);
          return;
        }
      }
      const i = cc.seizedItems.findIndex(x => x.id === item.id);
      const prev = i >= 0 ? cc.seizedItems[i] : {};
      const merged = Object.assign({}, prev, item);
      if (photo) { oldPhotoId = prev.photoId || null; Object.assign(merged, { photoId: photo.photoId, thumb: photo.thumb, capturedAt: photo.capturedAt, sha256: photo.sha256, geo: photo.geo, source: photo.source }); }
      if (i >= 0) cc.seizedItems[i] = merged; else cc.seizedItems.push(merged);
      addLog(cc, i >= 0 ? '修改涉案物品' : '登记涉案物品', '【' + kindLabelOf(item) + '】' + (item.brand || '品规未填') + ' ' + (item.qty || '?') + item.unit + (item.barcode ? '，条码 ' + item.barcode : '') + (price !== '' ? '，单价 ' + price + ' 元/' + item.priceUnit + (item.priceSource === 'manual' ? '（手工录入）' : '') : '') + countLog);
      addExtras(cc);
    });
    if (!saved) { if (!modalRoot.querySelector('form[data-form="seized"]')) renderSeizedModal(false); return; }
    if (oldPhotoId) Store.del(photoKey(oldPhotoId), true);
    // 价格目录里没有的条码：把品规和单价记入本地条码库，下次输入后 6 位即可带出
    if (cig && code && /^\d{6,14}$/.test(code) && item.brand && !catalogMap().has(code)) {
      const dict = await getJSON(K.barcodes, true, {}) || {};
      const cur = dict[code];
      const val = { brand: item.brand, price: price === '' ? null : price, unit: item.priceUnit };
      if (!cur || typeof cur === 'string' || cur.brand !== val.brand || cur.price !== val.price) {
        dict[code] = val; state.barcodeDict = dict;
        await setJSON(K.barcodes, dict, true);
      }
    }
    const p = priceLine(item);
    const label = (item.brand || code) + ' ' + (item.qty || '?') + item.unit + (p.amount != null ? '（' + fmtMoney(p.amount) + ' 元）' : '');
    render();
    if (next) {
      state.seizedEdit = cig ? blankSeized(item.unit === '支' ? '条' : item.unit) : blankSeized(null, item.kind, item.sub || '烟弹');
      // 上一条是摄像头扫码录入的：直接打开摄像头扫下一个品规
      const rescan = cig && s.via === 'live' && liveCameraSupported();
      renderSeizedModal(rescan ? false : cig ? 'barcode' : 'qty');
      if (rescan) startSeizedScan();
      toast((mergeInto ? '已合并：' : '已保存：') + label + '，请继续录入', 'ok', 2000);
    } else {
      closeModal(); state.seizedEdit = null;
      toast(seizedItemValid(item) ? (mergeInto ? '已合并：' : '已保存：') + label : '已保存，但信息不完整，打包前需补全', seizedItemValid(item) ? 'ok' : 'warn');
    }
  }

  async function deletePhoto(kind, id) {

    if (!(await confirmDialog('确定删除"' + label + '"的照片吗？删除后需重新拍摄。', { danger: true, okText: '删除' }))) return;

  async function deleteCase() {

  /* ========================= 笔录动作 ========================= */
  let recTimer = null, recSyncNeeded = false;

  // 输入后 0.7 秒自动保存正文；案件中的摘要在离开编辑页、定稿等时同步

  async function flushRecord(logAction, logDetail) {

  }
  async function newRecord(type) {

  async function openRecord(id, fromPop) {

  }
  async function leaveRecord() {

  }
  function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
  function setPath(obj, path, v) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }

  }
  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 640) + 'px'; }
  function renderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

  function onIdInput(prefix) {

  function onRecordInput(el) {

  async function appendGeoToPlace() {

  /* ========================= 生成证据包 ========================= */
  // 顺序不可变：1 校验必拍 → 2 校验涉案物品 → 3 检查 JSZip → 4 生成 ZIP
  async function generatePackage() {
    const c = state.caseData; if (!c) return false;
    const block = r => { state.packResult = Object.assign({ ok: false }, r); render(); const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' }); return false; };
    // 1. 必拍照片
    const missing = requiredMissing(c);
    if (missing.length) {
      return block({ title: '必拍照片未拍齐（缺 ' + missing.length + ' 项），无法生成证据包', items: missing.map(m => ({ text: m.cat + ' / ' + m.item.name, itemId: m.item.id })), detail: '点击缺项可跳转到对应位置。' });
    }
    // 2. 涉案物品
    if (c.template.requiresSeizedItems && !c.seizedItems.length) {
      return block({ title: '未登记涉案物品，无法生成证据包', detail: '本类案件须登记涉案物品的名称和数量（卷烟可扫码或输入条码）。' });
    }
    const bad = c.seizedItems.map((s, i) => ({ s, i })).filter(x => !seizedItemValid(x.s));
    if (bad.length) {
      return block({ title: '涉案物品信息不完整，无法生成证据包', items: bad.map(x => ({ text: '第 ' + (x.i + 1) + ' 条：' + (!String(x.s.brand || '').trim() ? '品规未填' : '') + (!(Number(x.s.qty) > 0) ? (String(x.s.brand || '').trim() ? '' : '，') + '数量须大于 0' : '') })) });
    }
    // 3. JSZip
    if (typeof JSZip === 'undefined') {
      return block({ title: '打包组件（JSZip）未加载，无法生成证据包', detail: '请重新打开完整的系统文件后重试；如仍失败请联系管理员。已采集的照片不受影响。' });
    }
    if (!hasSubtle()) return block({ title: '当前浏览器不支持 SHA-256 计算，无法生成核对信息', detail: '请使用最新版 Chrome / Safari 打开。' });
    // 4. 生成 ZIP
    showBusy('正在生成证据包…');
    try {
      const ts = Date.now();
      const num = safeName(c.number);
      const zip = new JSZip();
      const used = {};
      const uniq = name => { let n = name, k = 2; while (used[n]) { n = name.replace(/(\.[^.]+)$/, '_' + (k++) + '$1'); } used[n] = true; return n; };
      const files = [];
      const addPhoto = async (rec, fname, meta) => {
        const url = await loadPhoto(rec);
        if (!url) throw new Error('照片数据读取失败：' + meta.label + '。请重拍该项后再打包。');
        const bytes = dataUrlToBytes(url);
        const hash = await sha256Hex(bytes);
        const name = uniq(fname);
        zip.file(name, bytes, { binary: true, date: new Date(rec.capturedAt || ts) });
        files.push(Object.assign({ name, hash, rec, size: bytes.length }, meta));
      };
      for (const cat of c.template.categories) {
        for (const it of cat.items) {
          const ev = c.evidence[it.id];
          if (hasPhoto(ev)) await addPhoto(ev, num + '_' + safeName(cat.name) + '_' + safeName(it.name) + '.jpg', { group: 'evidence', label: cat.name + ' / ' + it.name, required: it.required });
        }
      }
      for (let i = 0; i < c.seizedItems.length; i++) {
        const s = c.seizedItems[i];
        if (s.photoId) await addPhoto(s, num + '_涉案物品_' + (i + 1) + '_' + safeName(s.brand) + '.jpg', { group: 'seized', label: '涉案物品 ' + (i + 1) + '：' + s.brand, seizedIndex: i });
      }
      for (let i = 0; i < c.extras.length; i++) {
        const x = c.extras[i];
        await addPhoto(x, num + '_补充照片_' + (i + 1) + '_' + safeName(x.caption) + '.jpg', { group: 'extra', label: '补充照片 ' + (i + 1) + '：' + x.caption });
      }
      // 核价表（有涉案物品时生成，按"涉案烟草专卖品核价表"模板版式）
      let sheet = null;
      if (c.seizedItems.length) {
        const x = await buildPriceSheetXlsx(c);
        sheet = { name: uniq(priceSheetName(c)), hash: await sha256Hex(x.bytes), data: x.data };
        zip.file(sheet.name, x.bytes, { binary: true, date: new Date(ts) });
      }
      // 笔录（Word）：现场笔录、询问笔录逐份生成
      const recFiles = [];
      for (const sum of (c.records || [])) {
        const doc = normalizeRecord(await getJSON(recKey(sum.id), true, null));
        if (!doc) throw new Error('笔录数据读取失败：' + REC_TYPES[sum.type] + (sum.name ? '（' + sum.name + '）' : '') + '。');
        const bytes = await buildRecordDocx(c, doc);
        const name = uniq(recordFileName(c, doc));
        zip.file(name, bytes, { binary: true, date: new Date(doc.updatedAt || ts) });
        recFiles.push({ name, hash: await sha256Hex(bytes), doc });
      }
      const logEntry = { at: ts, by: state.user.id, byName: state.user.name, action: '生成证据包', detail: '照片 ' + files.length + ' 张' + (sheet ? '，含核价表（涉案金额 ' + fmtMoney(sheet.data.totalAmount) + ' 元）' : '') + (recFiles.length ? '，笔录 ' + recFiles.length + ' 份' : '') };
      const manifest = buildManifest(c, files, ts, logEntry, sheet, recFiles);
      zip.file('证据清单说明.txt', '\ufeff' + manifest.replace(/\n/g, '\r\n'), { date: new Date(ts) });
      zip.file('SHA256SUMS.txt', files.map(f => f.hash + '  ' + f.name).concat(sheet ? [sheet.hash + '  ' + sheet.name] : [], recFiles.map(f => f.hash + '  ' + f.name)).join('\n') + '\n', { date: new Date(ts) });
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', mimeType: 'application/zip' });
      const filename = num + '_证据包_' + stamp(ts) + '.zip';
      const file = (typeof File === 'function') ? new File([blob], filename, { type: 'application/zip' }) : blob;
      state.lastPackage = { blob, filename, file };
      const optionalMissing = caseStats(c).optTotal - caseStats(c).optDone;
      await mutateCase(c.id, cc => { cc.lastPackagedAt = ts; cc.log.push(logEntry); }, ts);
      const amt = caseAmount(c.seizedItems);
      state.packResult = { ok: true, filename, size: blob.size, photos: files.length, optionalMissing, sheet: sheet ? sheet.name : '', amount: amt.total, unpriced: amt.count - amt.priced,
        records: recFiles.length, recDrafts: recFiles.filter(f => f.doc.status !== 'final').length };
      hideBusy();
      downloadBlob(blob, filename);
      render();
      const el = $('#pack-result'); if (el) el.scrollIntoView({ block: 'center' });
      return true;
    } catch (e) {
      hideBusy();
      return block({ title: '生成证据包失败', detail: e.message || String(e) });
    } finally { hideBusy(); }
  }
  function buildManifest(c, files, ts, logEntry, sheet, recFiles) {
    recFiles = recFiles || [];
